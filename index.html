<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ねこじま - 英検準2級 3Dたんぼ歩き</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap');

:root{
  --coral:#FF8FA3; --coral-deep:#F06A82;
  --mint:#6FE0C2; --mint-deep:#3FC7A6;
  --sunshine:#FFD873; --sunshine-deep:#F5B942;
  --lavender:#B9A6E8; --lavender-deep:#9A82D6;
  --plum:#4A3B5C; --plum-soft:#7A6A93;
  --card:#FFFFFF;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:'M PLUS Rounded 1c', sans-serif; background:#CFEFFF;}
#gameCanvas{position:fixed; inset:0; display:block; touch-action:none;}

/* ---------- HUD TOP ---------- */
.hud-top{
  position:fixed; top:14px; left:14px; right:14px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
  z-index:20; pointer-events:none;
}
.jar-wrap{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,0.82); backdrop-filter:blur(6px);
  border-radius:999px; padding:6px 18px 6px 6px;
  box-shadow:0 4px 14px rgba(122,106,147,0.2);
  pointer-events:auto;
}
.jar-svg{width:44px; height:44px; display:block;}
.jar-label{display:flex; flex-direction:column; line-height:1.1;}
.jar-label .title{font-size:11px; color:var(--plum-soft); font-weight:700;}
.jar-label .count{font-family:'Fredoka',sans-serif; font-size:18px; font-weight:600; color:var(--plum);}

.hint-pill{
  background:rgba(74,59,92,0.72); color:#fff; font-size:12.5px; font-weight:700;
  padding:9px 16px; border-radius:999px; max-width:60%; text-align:center;
  transition:opacity .5s ease; pointer-events:none;
}
.hint-pill.hide{opacity:0;}

/* ---------- INTERACT BUTTON ---------- */
#interactBtn{
  position:fixed; right:14px; bottom:26px; z-index:25;
  background:linear-gradient(135deg, var(--coral), var(--coral-deep));
  color:#fff; border:none; border-radius:999px; padding:16px 22px;
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:15px;
  box-shadow:0 6px 18px rgba(240,106,130,0.45);
  opacity:0; transform:translateY(12px) scale(0.9); pointer-events:none;
  transition:all .2s ease;
}
#interactBtn.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
#interactBtn:active{transform:scale(0.94);}

/* ---------- QUIZ OVERLAY ---------- */
#quizOverlay{
  position:fixed; inset:0; z-index:60; display:none;
  align-items:center; justify-content:center;
  background:rgba(74,59,92,0.45); backdrop-filter:blur(3px);
}
#quizOverlay.show{display:flex;}
.quiz-card{
  width:min(94vw, 560px); background:var(--card); border-radius:26px;
  padding:24px 22px 26px; box-shadow:0 20px 50px rgba(0,0,0,0.28);
  display:flex; flex-direction:column; align-items:center; gap:20px;
  border:3px solid transparent; transition:border-color .2s ease;
  position:relative;
  max-height:88vh; overflow-y:auto;
}
.quiz-card.flash-good{border-color:var(--mint-deep);}
.quiz-card.flash-bad{border-color:var(--coral-deep); animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

.npc-header{display:flex; align-items:center; gap:10px; align-self:flex-start; width:100%; padding-right:40px;}
#npcProfileBtn{
  background:#FBF9FF; border:2px solid #ECE5FA; border-radius:50%; width:32px; height:32px;
  font-size:15px; cursor:pointer; flex-shrink:0;
}
#npcProfileOverlay{
  position:fixed; inset:0; z-index:85; display:none;
  align-items:center; justify-content:center;
  background:rgba(74,59,92,0.5); backdrop-filter:blur(3px);
}
#npcProfileOverlay.show{ display:flex; }
.npc-avatar{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px;}
.npc-name{font-weight:800; color:var(--plum); font-size:15px;}
.npc-sub{font-size:11.5px; color:var(--plum-soft); font-weight:700;}
.dialogue-bubble{
  align-self:flex-start; max-width:92%; background:#F1F3FF; border-radius:14px 14px 14px 4px;
  padding:10px 14px; font-size:13.5px; font-weight:700; color:var(--plum);
}
.dialogue-bubble .en{ font-family:'Fredoka',sans-serif; font-size:17px; }
.dialogue-bubble .ja{ display:block; font-size:12px; color:var(--plum-soft); font-weight:700; margin-top:4px; }
.reply-label{font-size:11px; font-weight:800; color:var(--mint-deep); align-self:flex-end; margin-top:8px; display:block;}
.reaction-bubble{
  align-self:flex-start; max-width:92%; background:linear-gradient(135deg,#FFF3EC,#FFE8D9); border-radius:14px 14px 14px 4px;
  padding:10px 14px; font-size:13.5px; font-weight:700; color:var(--plum); margin-top:14px;
}
.reaction-bubble .en{ font-family:'Fredoka',sans-serif; font-size:15.5px; }
.reaction-bubble .ja{ display:block; font-size:11.5px; color:var(--plum-soft); font-weight:700; margin-top:4px; }

.prompt-label{font-size:12px; font-weight:700; color:var(--plum-soft);}
.prompt-main{display:flex; align-items:center; gap:10px; justify-content:center; min-height:48px; text-align:center;}
.en-word{font-family:'Fredoka',sans-serif; font-size:clamp(24px,6vw,30px); font-weight:600; color:var(--plum);}
.speak-btn{
  width:42px; height:42px; border-radius:50%; border:none;
  background:linear-gradient(135deg, var(--mint), var(--mint-deep));
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 4px 10px rgba(63,199,166,0.4); flex-shrink:0;
}
.speak-btn svg{width:20px; height:20px;}

.order-controls{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px; }
.undo-btn{
  background:#FBF9FF; border:2px solid #ECE5FA; border-radius:999px; padding:9px 16px;
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:13px; color:var(--plum-soft);
  cursor:pointer;
}
.undo-btn:active{ transform:scale(0.96); }

.npc-speech{font-size:12px; font-weight:800; color:var(--plum-soft); align-self:flex-start;}
.sentence-line{font-family:'Fredoka',sans-serif; font-size:clamp(18px,4.6vw,22px); font-weight:600; color:var(--plum); text-align:center; line-height:1.4;}
.blank-slot{display:inline-block; min-width:64px; padding:1px 6px; border-bottom:3px solid var(--lavender-deep); color:var(--lavender-deep); font-weight:700;}
.blank-slot.filled-correct{color:var(--mint-deep); border-color:var(--mint-deep);}
.blank-slot.filled-wrong{color:var(--coral-deep); border-color:var(--coral-deep);}
.ja-hint{font-size:12.5px; color:var(--plum-soft); font-weight:700; text-align:center; margin-top:8px;}
.vocab-callout{
  display:flex; flex-direction:column; gap:4px; align-self:stretch; text-align:left;
  background:#F1F3FF; border:2px solid #DCE1F7; border-radius:14px; padding:10px 14px; margin-top:10px;
}
.vocab-callout-word{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:15px; color:var(--lavender-deep); }
.vocab-callout-explain{ font-size:12px; color:var(--plum-soft); font-weight:700; line-height:1.5; }
.coaster-timerbar{ width:100%; height:8px; background:#F1E9EF; border-radius:999px; overflow:hidden; margin-top:6px; }
.coaster-timerfill{ height:100%; width:100%; background:linear-gradient(90deg, var(--coral), var(--coral-deep)); }
.exercise-tag{font-size:10.5px; font-weight:800; color:#fff; padding:3px 10px; border-radius:999px; align-self:flex-start;}
.exercise-tag.blank{background:var(--lavender-deep);}
.exercise-tag.order{background:var(--sunshine-deep); color:#6b4a00;}

.build-line{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-content:flex-start; min-height:44px; width:100%; padding:10px; background:#FBF9FF; border-radius:14px; border:2px dashed #ECE5FA; margin-top:12px;}
.build-chip{background:linear-gradient(135deg, var(--lavender), var(--lavender-deep)); color:#fff; padding:8px 13px; border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer; border:none; font-family:'Fredoka',sans-serif;}
.build-chip.correct{background:linear-gradient(135deg, var(--mint), var(--mint-deep));}
.build-chip.wrong{background:linear-gradient(135deg, var(--coral), var(--coral-deep));}
.build-chip.locked{pointer-events:none;}

.chip-pool{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:100%; margin-top:14px;}
.chip{background:#FBF9FF; border:2px solid #ECE5FA; color:var(--plum); padding:8px 13px; border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Fredoka',sans-serif; transition:all .15s ease;}
.chip:active{transform:scale(0.95);}

.sentence-answer{font-size:12.5px; color:var(--mint-deep); font-weight:700; text-align:center;}
.feedback-banner{
  align-self:center; text-align:center; font-family:'Fredoka',sans-serif; font-weight:700;
  font-size:15.5px; padding:7px 16px; border-radius:999px; animation:feedbackPop .3s ease;
  margin-top:14px;
}
.feedback-banner .ja{ font-family:'M PLUS Rounded 1c',sans-serif; font-size:11.5px; margin-left:5px; }
.feedback-banner.correct{ background:linear-gradient(135deg, var(--mint), var(--mint-deep)); color:#fff; }
.feedback-banner.wrong{ background:linear-gradient(135deg, var(--coral), var(--coral-deep)); color:#fff; }
@keyframes feedbackPop{
  0%{ transform:scale(0.7); opacity:0; }
  70%{ transform:scale(1.08); opacity:1; }
  100%{ transform:scale(1); }
}

.omikuji-btn{
  font-size:64px; background:none; border:none; cursor:pointer; padding:10px;
  animation:omikujiPulse 1.6s ease-in-out infinite;
}
@keyframes omikujiPulse{
  0%,100%{ transform:scale(1) rotate(-4deg); }
  50%{ transform:scale(1.08) rotate(4deg); }
}
.omikuji-result{
  font-family:'Fredoka',sans-serif; font-size:clamp(24px,6vw,32px); font-weight:700; color:var(--lavender-deep);
  animation:omikujiReveal .35s ease; text-align:center;
}
@keyframes omikujiReveal{
  0%{ transform:scale(0.4); opacity:0; }
  70%{ transform:scale(1.12); opacity:1; }
  100%{ transform:scale(1); }
}

.choices{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; margin-top:4px;}

.type-answer-row{ display:flex; gap:8px; width:100%; align-items:center; margin-top:6px; }
.type-answer-input{
  flex:1; border:2px solid #ECE5FA; border-radius:14px; padding:12px 14px;
  font-family:'Fredoka',sans-serif; font-size:18px; color:var(--plum); outline:none;
  background:#FBF9FF;
}
.type-answer-input:focus{ border-color:var(--lavender); }
.type-answer-input.correct{ border-color:var(--mint-deep); background:#EFFBF6; }
.type-answer-input.wrong{ border-color:var(--coral-deep); background:#FFF1F3; }
.type-answer-submit{
  background:linear-gradient(135deg, var(--mint), var(--mint-deep)); color:#fff; border:none;
  border-radius:14px; padding:12px 18px; font-weight:800; font-size:14px; cursor:pointer;
  font-family:'M PLUS Rounded 1c',sans-serif; white-space:nowrap; flex-shrink:0;
}
.type-answer-submit:disabled{ opacity:0.55; }
.correct-answer-inline{ display:block; font-size:12px; color:#fff; opacity:0.9; margin-top:3px; font-weight:700; }
.choice-btn{
  background:#FBF9FF; border:2px solid #ECE5FA; border-radius:14px; padding:10px 8px;
  font-family:'M PLUS Rounded 1c',sans-serif; font-size:14px; font-weight:700; color:var(--plum);
  cursor:pointer; transition:all .15s ease; text-align:center;
}
.choice-btn.correct{background:linear-gradient(135deg, var(--mint), var(--mint-deep)); border-color:var(--mint-deep); color:#fff;}
.choice-btn.wrong{background:linear-gradient(135deg, var(--coral), var(--coral-deep)); border-color:var(--coral-deep); color:#fff;}
.choice-btn.disabled{pointer-events:none; opacity:0.6;}
.choice-btn.disabled.correct, .choice-btn.disabled.wrong{opacity:1;}
.choice-btn.choice-hint{ cursor:default; opacity:0.85; }

.quiz-footer-btn{
  margin-top:4px; background:linear-gradient(135deg, var(--coral), var(--coral-deep)); color:#fff; border:none;
  border-radius:999px; padding:14px 34px; font-weight:800; font-size:16px; cursor:pointer;
  box-shadow:0 6px 16px rgba(240,106,130,0.4);
  opacity:0; transform:translateY(8px); pointer-events:none; transition:all .25s ease;
}
.quiz-footer-btn.show{opacity:1; transform:translateY(0); pointer-events:auto;}
.close-x{position:absolute; top:16px; right:18px; background:none; border:none; font-size:26px; color:var(--plum-soft); cursor:pointer; padding:6px; line-height:1;}

.npc-done-panel{display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px 0;}
.thinking-emoji{ animation:thinkBounce 1s ease-in-out infinite; }
@keyframes thinkBounce{
  0%,100%{ transform:translateY(0) rotate(-4deg); }
  50%{ transform:translateY(-8px) rotate(4deg); }
}
.thinking-dots span{ display:inline-block; animation:thinkDot 1.4s ease-in-out infinite; }
.thinking-dots span:nth-child(2){ animation-delay:.2s; }
.thinking-dots span:nth-child(3){ animation-delay:.4s; }
@keyframes thinkDot{
  0%,60%,100%{ opacity:0.2; transform:translateY(0); }
  30%{ opacity:1; transform:translateY(-3px); }
}
.npc-done-panel .emoji{font-size:44px;}
.npc-done-panel p{margin:0; color:var(--plum-soft); font-size:13px; text-align:center; font-weight:700;}

.sparkle{position:fixed; pointer-events:none; font-size:20px; z-index:70; animation:sparkleFly .9s ease-out forwards;}
@keyframes sparkleFly{0%{transform:translate(0,0) scale(0.4) rotate(0deg); opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(180deg); opacity:0;}}

/* narrow screens (iPhone portrait): shrink the HUD a little so it wraps
   less often. Review/rewards buttons are bottom-anchored now (mirroring
   settingsBtn's bottom-left placement) so they no longer depend on the
   top HUD's width/wrapping at all. */
@media (max-width: 430px){
  .jar-wrap{ padding:5px 14px 5px 5px; gap:8px; }
  .jar-svg{ width:38px; height:38px; }
  .jar-label .title{ font-size:11px; }
  .daily-wrap{ font-size:11px; padding:6px 10px; gap:6px; }
}
</style>
</head>
<body>

<div id="errBanner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:999; background:#F06A82; color:#fff; font:12px/1.4 monospace; padding:10px 14px; white-space:pre-wrap; max-height:40vh; overflow:auto;"></div>
<script>
  window.addEventListener('error', function(e){
    var el = document.getElementById('errBanner');
    el.style.display = 'block';
    el.textContent += 'ERROR: ' + e.message + '  (line ' + e.lineno + ')\n';
  });
  window.addEventListener('unhandledrejection', function(e){
    var el = document.getElementById('errBanner');
    el.style.display = 'block';
    el.textContent += 'PROMISE ERROR: ' + e.reason + '\n';
  });
</script>

<canvas id="gameCanvas"></canvas>

<div class="hud-top">
  <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
    <div class="jar-wrap">
      <svg class="jar-svg" viewBox="0 0 64 64">
        <path d="M20 14 L20 10 Q20 6 24 6 L40 6 Q44 6 44 10 L44 14" fill="none" stroke="#C9A96E" stroke-width="3" stroke-linecap="round"/>
        <rect x="17" y="12" width="30" height="6" rx="2" fill="#C9A96E"/>
        <path d="M19 18 Q17 18 17 21 L15 52 Q15 58 22 58 L42 58 Q49 58 49 52 L47 21 Q47 18 45 18 Z" fill="#E9F7FF" stroke="#CFE7F5" stroke-width="1.5"/>
        <g id="jarOrbs"></g>
      </svg>
      <div class="jar-label">
        <span class="title">ことだまジャー <span id="levelBadge" class="level-badge">Lv.1</span></span>
        <span class="count"><span id="wordPercent">0%</span></span>
      </div>
    </div>
    <div class="daily-wrap">
      <span>📅 <span id="dailyCount">0</span>/<span id="dailyGoalLabel">15</span></span>
      <span>🔥<span id="streakCount">0</span>日</span>
      <span class="coin-inline">
        <svg class="coin-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD54A" stroke="#E8A93C" stroke-width="1.5"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#E8A93C" stroke-width="1.2"/></svg>
        <span class="coin-count" id="coinCount">0</span>
      </span>
    </div>
  </div>
</div>
<div style="position:fixed; top:14px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:4px; z-index:19; pointer-events:none;">
  <span style="font-family:'Fredoka',sans-serif; font-weight:700; font-size:15px; color:#fff; text-shadow:0 2px 6px rgba(74,59,92,0.35);">🐾 ねこじま</span>
</div>
<div class="hint-pill" id="hintPill" style="display:none;"></div>

<button id="interactBtn">💬 はなしかける</button>

<button id="settingsBtn">⚙️ 設定</button>
<button id="reviewBtn">📖 復習ノート<span id="mistakeBadge" class="mistake-badge"></span></button>
<button id="rewardsBtn">🎁 ごほうび</button>

<div id="settingsOverlay">
  <div class="npc-create-card" style="max-width:360px;">
    <button class="close-x" id="closeSettings">✕</button>
    <h2>⚙️ 設定</h2>

    <div class="settings-row">
      <span class="settings-row-label">画面の明るさ</span>
      <button id="dayNightBtn">🌙 よる</button>
    </div>
    <div class="settings-row">
      <span class="settings-row-label">今いる島</span>
      <button id="islandBadge">🌳 はじまりの島</button>
    </div>
    <div class="settings-row">
      <span class="settings-row-label">セーブコード</span>
      <button id="myCodeBtn">🔑 マイコードを見る</button>
    </div>
  </div>
</div>

<div id="islandOverlay">
  <div class="npc-create-card" style="max-width:360px;">
    <button class="close-x" id="closeIslandOverlay">✕</button>
    <h2>🏝️ 島マップ</h2>
    <p class="reward-sub">ことばを覚えると、あたらしい島に行けるようになるよ！</p>
    <div id="islandList"></div>
  </div>
</div>

<style>
#reviewBtn, #rewardsBtn{
  position:fixed; right:14px; z-index:22;
  background:rgba(255,255,255,0.82); backdrop-filter:blur(6px);
  border:none; border-radius:999px; padding:10px 16px;
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:12.5px; color:var(--plum);
  box-shadow:0 4px 14px rgba(122,106,147,0.2); cursor:pointer;
}
#reviewBtn{ top:14px; }
#rewardsBtn{ top:60px; }
.mistake-badge{
  display:none; align-items:center; justify-content:center;
  position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 4px;
  background:var(--coral-deep); color:#fff; font-size:10px; font-weight:800; border-radius:999px;
}
#reviewBtn{ position:fixed; }

.coin-inline{ display:inline-flex; align-items:center; gap:4px; margin-left:2px; }
.coin-icon-svg{ width:15px; height:15px; }
.coin-count{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:14px; color:var(--plum); }

.level-badge{
  display:inline-block; background:linear-gradient(135deg, var(--lavender), var(--lavender-deep));
  color:#fff; font-size:9.5px; font-weight:800; padding:1px 7px; border-radius:999px; margin-left:4px; vertical-align:middle;
}
.daily-wrap{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,0.82); backdrop-filter:blur(6px);
  border-radius:999px; padding:8px 14px;
  box-shadow:0 4px 14px rgba(122,106,147,0.2);
  pointer-events:auto;
  font-family:'Fredoka',sans-serif; font-weight:700; font-size:13px; color:var(--plum);
}

#minimapWrap{
  position:fixed; left:16px; bottom:26px; z-index:24;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  pointer-events:none;
}
#minimapCanvas{
  width:120px; height:120px; border-radius:50%;
  background:rgba(255,255,255,0.75); backdrop-filter:blur(4px);
  box-shadow:0 4px 16px rgba(122,106,147,0.28); border:3px solid rgba(255,255,255,0.9);
}
.minimap-label{
  font-family:'Fredoka',sans-serif; font-weight:700; font-size:11px; color:var(--plum);
  background:rgba(255,255,255,0.75); padding:2px 10px; border-radius:999px;
}
#dayNightBtn{
  pointer-events:auto;
  background:rgba(255,255,255,0.85); backdrop-filter:blur(6px);
  border:none; border-radius:999px; padding:8px 14px;
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:12px; color:var(--plum);
  box-shadow:0 4px 14px rgba(122,106,147,0.2); cursor:pointer;
}

<script>
/* =========================================================
   BACKEND WIRING
   This game was built inside a Claude.ai artifact, where
   `window.storage` and direct AI API calls are proxied automatically.
   Outside that sandbox (i.e. once hosted), neither exists — so this
   section replaces both with calls to our own Vercel API functions (see
   /api), which talk to Supabase (save data) and the real Google Gemini
   API (sentence generation) using credentials kept server-side.
========================================================= */
const PLAYER_CODE_KEY = 'neko_player_code';

function getPlayerCode(){ return localStorage.getItem(PLAYER_CODE_KEY); }
function setPlayerCode(code){ localStorage.setItem(PLAYER_CODE_KEY, code); }

function generatePlayerCode(){
  const words = ['ねこ','みかん','さくら','ほし','つき','うみ','もも','くも','はな','ゆき'];
  const w = words[Math.floor(Math.random()*words.length)];
  const n = Math.floor(1000 + Math.random()*9000);
  return `${w}-${n}`;
}

// drop-in replacement for the artifact's window.storage.get/set,
// backed by our own save-data / load-data Vercel API functions
const remoteStorage = {
  async get(key){
    const code = getPlayerCode();
    if(!code) return null;
    try{
      const res = await fetch(`/api/load-data?code=${encodeURIComponent(code)}&key=${encodeURIComponent(key)}`);
      if(!res.ok) return null;
      const json = await res.json();
      if(json.value === null || json.value === undefined) return null;
      return { key, value: json.value };
    } catch(e){ return null; }
  },
  async set(key, value){
    const code = getPlayerCode();
    if(!code) return null;
    try{
      const res = await fetch('/api/save-data', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ code, key, value }),
      });
      if(!res.ok) return null;
      return { key, value };
    } catch(e){ return null; }
  }
};
// keep the rest of the game's code unchanged — it already calls
// `window.storage.get/set`, so we just point that name at our shim
window.storage = remoteStorage;

// sends a prompt to our generate-sentence Vercel API function, which
// forwards it to the real Gemini API using a server-side key
async function callClaudeProxy(prompt){
  const res = await fetch('/api/generate-sentence', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ prompt }),
  });
  if(!res.ok){
    let detail = '';
    try{ detail = await res.text(); } catch(e){}
    console.error('generate-sentence backend error:', res.status, detail);
    throw new Error('proxy request failed: ' + res.status);
  }
  return res.json();
}

function showCodeReveal(code){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; background:rgba(74,59,92,0.55); font-family:"M PLUS Rounded 1c",sans-serif;';
  overlay.innerHTML = `
    <div style="background:#fff; border-radius:26px; padding:28px 26px; max-width:340px; width:88vw; box-shadow:0 20px 50px rgba(0,0,0,0.25); text-align:center;">
      <div style="font-size:36px;">📝</div>
      <p style="font-size:13px; color:#7A6A93; font-weight:700; margin:6px 0 12px;">きみのセーブコードだよ。メモしておいてね！</p>
      <div style="font-family:'Fredoka',sans-serif; font-size:26px; font-weight:700; color:#4A3B5C; background:#FBF9FF; border:2px dashed #ECE5FA; border-radius:14px; padding:14px; margin-bottom:16px;">${code}</div>
      <button id="codeRevealOk" style="width:100%; padding:12px; border:none; border-radius:999px; background:linear-gradient(135deg,#FF8FA3,#F06A82); color:#fff; font-weight:800; font-size:14px; cursor:pointer;">わかった！</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#codeRevealOk').onclick = ()=> overlay.remove();
}

document.getElementById('myCodeBtn').addEventListener('click', ()=>{
  const code = getPlayerCode();
  if(code) showCodeReveal(code);
});

document.getElementById('settingsBtn').addEventListener('click', ()=>{
  document.getElementById('settingsOverlay').classList.add('show');
});
document.getElementById('closeSettings').addEventListener('click', ()=>{
  document.getElementById('settingsOverlay').classList.remove('show');
});

function ensurePlayerCode(){
  return new Promise(resolve=>{
    const existing = getPlayerCode();
    if(existing){ resolve(existing); return; }

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#CFEFFF,#F3E8FF); font-family:"M PLUS Rounded 1c",sans-serif;';
    overlay.innerHTML = `
      <div style="background:#fff; border-radius:26px; padding:28px 26px; max-width:360px; width:90vw; box-shadow:0 20px 50px rgba(0,0,0,0.2); text-align:center;">
        <div style="font-size:44px;">🐾</div>
        <h2 style="font-family:'Fredoka',sans-serif; color:#4A3B5C; margin:8px 0 4px;">ねこじまへ ようこそ！</h2>
        <p style="font-size:13px; color:#7A6A93; font-weight:700; margin:0 0 18px;">セーブコードで、どの端末でも つづきから あそべるよ。</p>
        <button id="pcNewBtn" style="width:100%; padding:14px; border:none; border-radius:999px; background:linear-gradient(135deg,#FF8FA3,#F06A82); color:#fff; font-weight:800; font-size:14px; cursor:pointer; margin-bottom:10px;">✨ あたらしく はじめる</button>
        <div style="font-size:11px; color:#7A6A93; font-weight:700; margin:12px 0 6px;">もう コードを持っている子は↓</div>
        <input id="pcInput" type="text" placeholder="例: ねこ-1234" style="width:100%; box-sizing:border-box; padding:12px; border-radius:12px; border:2px solid #ECE5FA; font-size:14px; text-align:center; margin-bottom:10px;">
        <button id="pcContinueBtn" style="width:100%; padding:12px; border:none; border-radius:999px; background:#FBF9FF; border:2px solid #ECE5FA; color:#4A3B5C; font-weight:800; font-size:13px; cursor:pointer;">このコードで つづける</button>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.querySelector('#pcNewBtn').onclick = ()=>{
      const code = generatePlayerCode();
      setPlayerCode(code);
      overlay.remove();
      showCodeReveal(code);
      resolve(code);
    };
    overlay.querySelector('#pcContinueBtn').onclick = ()=>{
      const val = overlay.querySelector('#pcInput').value.trim();
      if(!val) return;
      setPlayerCode(val);
      overlay.remove();
      resolve(val);
    };
  });
}

// each of the 30 NPCs owns an explicit ~50-word slice of VOCAB (instead of
// filtering by category) — this is what makes "~50 words per NPC" exact
// regardless of how unevenly categories happen to be sized
function buildNpcRoster(){
  const worldChunkSize = Math.ceil(VOCAB.length / WORLD_IDS.length);
  const defs = [];
  WORLD_IDS.forEach((world, wi)=>{
    const worldWords = VOCAB.slice(wi*worldChunkSize, (wi+1)*worldChunkSize);
    const npcChunkSize = Math.ceil(worldWords.length / NPCS_PER_WORLD);
    for(let ni=0; ni<NPCS_PER_WORLD; ni++){
      const words = worldWords.slice(ni*npcChunkSize, (ni+1)*npcChunkSize);
      if(words.length === 0) continue;
      const idx = wi*NPCS_PER_WORLD + ni;
      const type = NPC_TYPE_POOL[idx % NPC_TYPE_POOL.length];
      const [color, earColor] = NPC_COLOR_POOL[idx % NPC_COLOR_POOL.length];
      const angle = (ni / NPCS_PER_WORLD) * Math.PI * 2;
      const radius = 18 + (ni % 3) * 5;
      const pos = [Math.round(Math.cos(angle)*radius*10)/10, 0, Math.round(Math.sin(angle)*radius*10)/10];
      defs.push({
        id: 'npc_'+idx,
        name: NPC_NAME_POOL[idx % NPC_NAME_POOL.length],
        type,
        emoji: EMOJI_BY_TYPE[type],
        breed: NPC_BREED_POOL[idx % NPC_BREED_POOL.length],
        likes: NPC_LIKES_POOL[idx % NPC_LIKES_POOL.length],
        dislikes: NPC_DISLIKES_POOL[(idx + 3) % NPC_DISLIKES_POOL.length],
        color, earColor,
        pos,
        personality: NPC_PERSONALITY_POOL[idx % NPC_PERSONALITY_POOL.length],
        bio: `${WORLD_LABELS[world]}で ことばを おしえてくれる なかまだよ。`,
        world,
        wordList: words,
      });
    }
  });
  return defs;
}

/* =========================================================
   SPACED REPETITION for missed words — expanding intervals
   (measured in "questions answered", not days, so it works within
   normal play regardless of session length). Research on the spacing
   effect favors a real gap before the first re-test (immediate massed
   repetition helps less) and growing intervals thereafter (~2.5x each
   step, similar to SM-2/Leitner-style schedulers); a wrong answer at
   any point resets back to the shortest interval.
========================================================= */
const SRS_INTERVALS = [12, 30, 75]; // "due again after N more questions answered"
let totalAnswered = 0;
let srsSchedule = {}; // en -> { stage, dueAt }

function scheduleSRSReview(en){
  srsSchedule[en] = { stage: 0, dueAt: totalAnswered + SRS_INTERVALS[0] };
  saveProgress();
}
function advanceSRSReview(en){
  const existing = srsSchedule[en];
  if(!existing) return; // this word wasn't under active spaced review
  const nextStage = existing.stage + 1;
  if(nextStage >= SRS_INTERVALS.length){
    delete srsSchedule[en]; // graduated — reinforced enough times to drop it
  } else {
    srsSchedule[en] = { stage: nextStage, dueAt: totalAnswered + SRS_INTERVALS[nextStage] };
  }
  saveProgress();
}
function getDueSRSItem(){
  for(const en in srsSchedule){
    if(srsSchedule[en].dueAt <= totalAnswered){
      const v = VOCAB.find(x=>x.en===en);
      if(v) return v;
    }
  }
  return null;
}

async function saveProgress(){
  try{
    await window.storage.set('neko_progress', JSON.stringify({
      mastered: Array.from(masteredWords),
      mistakes: mistakeCounts,
      coins,
      ownedCats: Array.from(ownedCats),
      dailyCount, lastPlayDate, lastGoalDate, streak,
      totalAnswered, srsSchedule,
    }), false);
  } catch(e){ /* storage unavailable */ }
}

async function loadProgress(){
  try{
    const res = await window.storage.get('neko_progress');
    if(res && res.value){
      const data = JSON.parse(res.value);
      masteredWords = new Set(data.mastered || []);
      mistakeCounts = data.mistakes || {};
      coins = data.coins || 0;
      ownedCats = new Set(data.ownedCats || []);
      dailyCount = data.dailyCount || 0;
      lastPlayDate = data.lastPlayDate || null;
      lastGoalDate = data.lastGoalDate || null;
      streak = data.streak || 0;
      totalAnswered = data.totalAnswered || 0;
      srsSchedule = data.srsSchedule || {};
      updateWordPercent();
      rebuildJarOrbs();
      refreshMistakeBadge();
      updateCoinHUD();
      checkDailyRollover();
      updateDailyHUD();
      lastKnownLevel = getLevel();
      updateLevelHUD();
    }
  } catch(e){ /* first time playing, nothing saved yet */ }
  // always initialize this, whether or not saved progress existed —
  // otherwise a brand-new player (no save data yet) would never have it
  // set at all, leaving grammar checkpoints permanently disabled
  lastGrammarAtCount = totalAnswered;
}

function makeGrassTexture(){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,256,256);
  for(let i=0;i<2200;i++){
    const x = Math.random()*256, y = Math.random()*256;
    const len = 3 + Math.random()*6;
    const angle = Math.random()*Math.PI;
    const shade = 150 + Math.random()*95; // varying lightness -> tints as light/dark patches once multiplied by the theme color
    ctx.strokeStyle = `rgba(${Math.round(shade*0.75)},${Math.round(shade)},${Math.round(shade*0.7)},0.55)`;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(angle)*len, y - Math.sin(angle)*len);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(26,26);
  return tex;
}

// large digital vision billboard — a big glowing screen with scrolling
// English words, mounted at height on a slim pole
const digitalVisionScreens = [];
function makeDigitalVision(x,z,rotY,words){
  const tickerText = words.join('   ✦   ') + '   ✦   ';
  const SCALE = 1.6; // overall size multiplier for the whole billboard

  // measure the full text first, then size the canvas to fit it exactly —
  // this was the bug: a fixed-width canvas was narrower than the actual
  // text, so it got cut off mid-word and the loop seam read as garbage
  // (e.g. "...TECHNOL" immediately followed by "FUTURE..." = "technolfuture")
  const fontPx = Math.round(46 * SCALE);
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');
  mctx.font = `700 ${fontPx}px sans-serif`;
  const textWidth = Math.ceil(mctx.measureText(tickerText).width);

  const canvas = document.createElement('canvas');
  canvas.width = textWidth;
  canvas.height = Math.round(128 * SCALE);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0A1A3A';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font = `700 ${fontPx}px sans-serif`;
  ctx.fillStyle = '#6BCBFF';
  ctx.textBaseline = 'middle';
  ctx.fillText(tickerText, 0, canvas.height/2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  // show only a natural-size window of the (now wider) canvas at once,
  // matching the original visible width (scaled up with everything
  // else), so the text doesn't shrink to fit the whole phrase into the
  // screen's fixed physical size
  tex.repeat.x = (512 * SCALE) / canvas.width;

  const screenW = 3.6 * SCALE, screenH = 0.9 * SCALE;
  const frameHalfDepth = 0.045 * SCALE;
  const screenOffset = frameHalfDepth + 0.01; // sit clearly outside the frame's surface, not exactly coplanar with it (avoids z-fighting that let the dark frame win the depth test and hide the text)
  // NOTE: a plane rotated 180° to face the other way already shows its
  // texture correctly on its own — rotation alone preserves left-to-right
  // reading order, so both faces just share the same texture; only the
  // rotation differs (mirroring the texture on top of that would flip
  // it twice, back into backwards text)
  const screenFront = new THREE.Mesh(new THREE.PlaneGeometry(screenW,screenH), new THREE.MeshBasicMaterial({map:tex}));
  screenFront.position.z = screenOffset;
  const screenBack = new THREE.Mesh(new THREE.PlaneGeometry(screenW,screenH), new THREE.MeshBasicMaterial({map:tex}));
  screenBack.rotation.y = Math.PI;
  screenBack.position.z = -screenOffset;

  const frame = new THREE.Mesh(new THREE.BoxGeometry(screenW+0.2, screenH+0.2, 0.09*SCALE), new THREE.MeshLambertMaterial({color:0x2A2F45}));
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08*SCALE,0.1*SCALE,3.2*SCALE,8), new THREE.MeshLambertMaterial({color:0xAEB4C7}));
  pole.position.y = -(screenH/2 + 3.2*SCALE/2 + 0.1);
  const g = new THREE.Group();
  g.add(frame, screenFront, screenBack, pole);
  g.position.set(x, 3.5*SCALE, z);
  g.rotation.y = rotY;
  cityGroup.add(g);
  digitalVisionScreens.push(tex);
}

/* =========================================================
   MAZE (separate space) — the maze itself lives FAR from the normal
   world (a remote zone at a huge offset), so it takes zero space in
   the shared themepark and can't overlap anything. Only a small gate
   building sits in themepark; interacting with it teleports the player
   to the remote zone, and reaching the exit teleports back.

   This is a genuine branching maze (5x5 grid, generated as a spanning
   tree so there is exactly ONE solution path with real dead ends —
   not just a winding single corridor), verified solvable end-to-end by
   simulation before shipping. Signs are placed at every real decision
   point (where more than one direction is open) with a short English
   direction instruction the player has to read and follow correctly.
========================================================= */
const MAZE_ZONE_CENTER = { x: 600, z: 600 }; // far enough that it's never reachable by normal walking

const MAZE_WALL_HEIGHT = 1.6;

// as a spanning-tree maze (generated offline, verified solvable, and
// hand-transcribed here) — entrance gap at the south of column 1,
// exit gap at the west of row 0
const MAZE_WALL_SEGMENTS = [
  {x1:5,z1:0,x2:5,z2:5}, {x1:0,z1:10,x2:5,z2:10}, {x1:5,z1:10,x2:5,z2:15}, {x1:5,z1:15,x2:5,z2:20},

  {x1:15,z1:15,x2:20,z2:15}, {x1:20,z1:20,x2:20,z2:25}, {x1:20,z1:5,x2:25,z2:5},
  {x1:0,z1:0,x2:5,z2:0}, {x1:10,z1:0,x2:15,z2:0}, {x1:15,z1:0,x2:20,z2:0}, {x1:20,z1:0,x2:25,z2:0},

// build both the collision AABBs and the visible hedge meshes from the
// same segment list, so they can never drift out of sync with each other
const MAZE_COLLIDERS = [];
MAZE_WALL_SEGMENTS.forEach(seg=>{
  const x1 = seg.x1 + MAZE_OFFSET.x, z1 = seg.z1 + MAZE_OFFSET.z;
  const x2 = seg.x2 + MAZE_OFFSET.x, z2 = seg.z2 + MAZE_OFFSET.z;
  const half = MAZE_WALL_THICKNESS/2;
  MAZE_COLLIDERS.push({
    minX: Math.min(x1,x2) - half, maxX: Math.max(x1,x2) + half,
    minZ: Math.min(z1,z2) - half, maxZ: Math.max(z1,z2) + half,
  });
  const isVertical = (seg.x1 === seg.x2);
  const len = Math.hypot(x2-x1, z2-z1) + MAZE_WALL_THICKNESS;
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(isVertical ? MAZE_WALL_THICKNESS : len, MAZE_WALL_HEIGHT, isVertical ? len : MAZE_WALL_THICKNESS),
    new THREE.MeshLambertMaterial({color:0x4FA84A})
  );
  wall.position.set((x1+x2)/2, MAZE_WALL_HEIGHT/2, (z1+z2)/2);
  mazeGroup.add(wall);
});

function isMazeBlocked(x, z, radius){
  if(!inMazeMode) return false; // walls only apply while actually inside the maze zone
  for(let i=0;i<MAZE_COLLIDERS.length;i++){
    const b = MAZE_COLLIDERS[i];
    const overlapX = (x + radius > b.minX) && (x - radius < b.maxX);
    if(!overlapX) continue;
    const overlapZ = (z + radius > b.minZ) && (z - radius < b.maxZ);
    if(overlapX && overlapZ) return true;
  }
  return false;
}

// simple wrapped-text sign on a post, readable just by walking past —
// no interaction needed, matching how a real signpost works
function wrapSignText(ctx, text, cx, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  const lines = [];
  words.forEach(w=>{
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  });
  if(line) lines.push(line);
  lines.forEach((l,i)=> ctx.fillText(l, cx, y + i*lineHeight));
}
function makeSignpost(x,z,rotY,textEn,textJa,arrowDir){
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 140;
  const ctx = canvas.getContext('2d');
  const rr=(px,py,pw,ph,r)=>{ ctx.beginPath(); ctx.moveTo(px+r,py); ctx.arcTo(px+pw,py,px+pw,py+ph,r); ctx.arcTo(px+pw,py+ph,px,py+ph,r); ctx.arcTo(px,py+ph,px,py,r); ctx.arcTo(px,py,px+pw,py,r); ctx.closePath(); };
  ctx.fillStyle = 'rgba(255,255,255,0.96)';
  rr(4,4,312,132,14); ctx.fill();
  ctx.strokeStyle = '#8A6D42'; ctx.lineWidth = 4;
  rr(6,6,308,128,12); ctx.stroke();
  // a big, unambiguous colored arrow — a second, language-independent
  // way to confirm the direction, so the text alone doesn't have to be
  // trusted blindly
  if(arrowDir === 'left' || arrowDir === 'right'){
    ctx.save();
    ctx.translate(272, 70);
    if(arrowDir === 'left') ctx.scale(-1,1);
    ctx.fillStyle = '#FF6BC4';
    ctx.beginPath();
    ctx.moveTo(-20,0); ctx.lineTo(15,-24); ctx.lineTo(15,-9); ctx.lineTo(30,-9);
    ctx.lineTo(30,9); ctx.lineTo(15,9); ctx.lineTo(15,24);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#4A3B5C';
  ctx.font = '700 22px sans-serif';
  ctx.textAlign = 'center';
  wrapSignText(ctx, textEn, 130, 42, 220, 27);
  ctx.font = '600 15px sans-serif';
  ctx.fillStyle = '#8878A0';
  ctx.textAlign = 'left';
  wrapSignText(ctx, textJa, 12, 112, 300, 20);
  ctx.textAlign = 'center';
  const tex = new THREE.CanvasTexture(canvas);
  // a single front-facing plane, mounted flush on/near the hedge wall —
  // simpler and more reliable than a double-sided post: it's only ever
  // meant to be read from one direction (the way the player naturally
  // approaches in that stretch of corridor), so there's no risk of the
  // mirrored-text problem a two-sided sign has
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(1.3,0.58),
    new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.FrontSide})
  );
  plane.position.set(x, 1.15, z);
  plane.rotation.y = rotY;
  return plane;
}

function updateCoasterRide(dt){
  if(!rideActive || !coasterRideCarMesh.visible) return;
  rideElapsed += dt;
  const t = Math.min(1, rideElapsed / RIDE_DURATION);

  const segs = COASTER_RIDE_PATH.length - 1;
  const scaled = t * segs;
  const i = Math.min(segs-1, Math.floor(scaled));
  const localT = scaled - i;
  const [x1,z1,y1] = COASTER_RIDE_PATH[i], [x2,z2,y2] = COASTER_RIDE_PATH[i+1];
  player.position.set(
    x1 + (x2-x1)*localT,
    y1 + (y2-y1)*localT,
    z1 + (z2-z1)*localT
  );
  player.rotation.y = Math.atan2(x2-x1, z2-z1);
  coasterRideCarMesh.position.set(player.position.x, player.position.y - 0.06, player.position.z);
  coasterRideCarMesh.rotation.y = player.rotation.y;
  // a bit punchier than the sky pod's gentle bob — feels more like a coaster
  const bob = Math.sin(rideElapsed*5)*0.1;
  const bank = Math.sin(rideElapsed*1.8)*0.12;
  coasterRideCarMesh.position.y += bob;
  coasterRideCarMesh.rotation.z = bank;
  player.position.y += bob;
  player.rotation.z = bank;

  COASTER_RIDE_CAPTIONS.forEach(c=>{
    if(!c._shown && t >= c.at){
      c._shown = true;
      rideCaption(`<span style="font-size:14px;">${c.en}</span><br><span style="font-size:12px; opacity:.85;">${c.ja}</span>`);
    }
  });

  if(t >= 1){
    rideActive = false;
    player.position.set(COASTER_RIDE_STATION_POS.x, 0, COASTER_RIDE_STATION_POS.z);
    player.rotation.z = 0;
    coasterRideCarMesh.visible = false;
    coins += 1;
    updateCoinHUD();
    saveProgress();
    showToast('🎢 コースター、おつかれさま！ +1🪙');
    const el = document.getElementById('rideCaption');
    if(el) el.style.opacity = '0';
  }
}

function updateSkyPodRide(dt){
  if(!rideActive || !flyingPodMesh.visible) return;
  rideElapsed += dt;
  const t = Math.min(1, rideElapsed / RIDE_DURATION);

  // walk along RIDE_PATH proportional to t
  const segs = RIDE_PATH.length - 1;
  const scaled = t * segs;
  const i = Math.min(segs-1, Math.floor(scaled));
  const localT = scaled - i;
  const [x1,z1,y1] = RIDE_PATH[i], [x2,z2,y2] = RIDE_PATH[i+1];
  player.position.set(
    x1 + (x2-x1)*localT,
    y1 + (y2-y1)*localT,
    z1 + (z2-z1)*localT
  );
  player.rotation.y = Math.atan2(x2-x1, z2-z1);
  // platform sits right under the character's feet, so they visibly
  // stand on it rather than being replaced by it
  flyingPodMesh.position.set(player.position.x, player.position.y - 0.06, player.position.z);
  flyingPodMesh.rotation.y = player.rotation.y;
  // a gentle bob + slight bank into turns, so it reads as flying rather
  // than sliding — applied to both the platform and the rider together
  const bob = Math.sin(rideElapsed*3)*0.08;
  const bank = Math.sin(rideElapsed*1.3)*0.06;
  flyingPodMesh.position.y += bob;
  flyingPodMesh.rotation.z = bank;
  player.position.y += bob;
  player.rotation.z = bank;

  // show captions as we pass each trigger point
  RIDE_CAPTIONS.forEach(c=>{
    if(!c._shown && t >= c.at){
      c._shown = true;
      rideCaption(`<span style="font-size:14px;">${c.en}</span><br><span style="font-size:12px; opacity:.85;">${c.ja}</span>`);
    }
  });

  if(t >= 1){
    rideActive = false;
    RIDE_CAPTIONS.forEach(c=> c._shown = false); // reset for next ride
    player.position.set(RIDE_STATION_POS.x, 0, RIDE_STATION_POS.z);
    player.rotation.z = 0;
    flyingPodMesh.visible = false;
    coins += 1;
    updateCoinHUD();
    saveProgress();
    showToast('🚀 空中散歩、おつかれさま！ +1🪙');
    const el = document.getElementById('rideCaption');
    if(el) el.style.opacity = '0';
  }
}

// ミニジェットコースターのレール — a decorative curved track snaking
// through the air, no functional ride (matches the "mini/decorative"
// scope, keeps zero collision risk)
function makeMiniCoasterRail(){
  // control points (with height baked in per-point, so it interpolates
  // smoothly along the whole curve — the old version computed height
  // per SEGMENT instead, causing a visible jump/kink at every joint)
  const points3d = [
    [-25,-27,2.5], [-17,-21,5.5], [-8,-25,8], [1,-19,5],
    [8,-25,6.5], [14,-18,3.5], [10,-9,5.5], [1,-7,8],
    [-8,-5,4.5], [-17,-8,6.5], [-24,-15,3],
  ].map(([x,z,y]) => new THREE.Vector3(x,y,z));
  const curve = new THREE.CatmullRomCurve3(points3d, true, 'catmullrom', 0.4);
  const railMat = new THREE.MeshPhongMaterial({color:0xFFD93D, shininess:110});
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 220, 0.16, 8, true), railMat);
  themeparkDecorGroup.add(tube);
  // a thinner second rail alongside, for a proper twin-track look
  const railMat2 = new THREE.MeshPhongMaterial({color:0xFF6BC4, shininess:110});
  const offsetPoints = points3d.map(p => p.clone().add(new THREE.Vector3(0.35,0.05,0)));
  const curve2 = new THREE.CatmullRomCurve3(offsetPoints, true, 'catmullrom', 0.4);
  const tube2 = new THREE.Mesh(new THREE.TubeGeometry(curve2, 220, 0.1, 6, true), railMat2);
  themeparkDecorGroup.add(tube2);
  // support pillars at intervals along the curve
  const pillarMat = new THREE.MeshLambertMaterial({color:0xAEB4C7});
  const pillarCount = 18;
  for(let i=0;i<pillarCount;i++){
    const p = curve.getPointAt(i/pillarCount);
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.12,p.y,6), pillarMat);
    pillar.position.set(p.x, p.y/2, p.z);
    themeparkDecorGroup.add(pillar);
  }
  // a small cart that actually travels along the rail, so it reads as a
  // real ride rather than just a static track
  const cart = new THREE.Group();
  const carColors = [0xFF6B9D, 0x6BCBFF, 0xFFD873];
  for(let ci=0; ci<3; ci++){
    const car = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.26,0.48), new THREE.MeshPhongMaterial({color:carColors[ci], shininess:130, specular:0xffffff}));
    body.position.y = 0.14;
    car.add(body);
    // two seat bumps facing forward, giving it a proper "ride car" silhouette
    [-0.13,0.13].forEach(dz=>{
      const seat = new THREE.Mesh(new THREE.SphereGeometry(0.16,10,8), new THREE.MeshPhongMaterial({color:0xFFFFFF, shininess:110}));
      seat.scale.set(1,0.75,0.9);
      seat.position.set(0,0.32,dz);
      car.add(seat);
    });
    // safety bar across the front
    const bar = new THREE.Mesh(new THREE.TorusGeometry(0.24,0.028,6,14,Math.PI), new THREE.MeshBasicMaterial({color:0x2A2F45}));
    bar.rotation.z = Math.PI/2;
    bar.rotation.y = Math.PI/2;
    bar.position.set(0.16,0.32,0);
    car.add(bar);
    // small wheels underneath
    [-0.18,0.18].forEach(dx=>{
      [-0.19,0.19].forEach(dz=>{
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.06,10), new THREE.MeshLambertMaterial({color:0x2A2F45}));
        wheel.rotation.x = Math.PI/2;
        wheel.position.set(dx,0.02,dz);
        car.add(wheel);
      });
    });
    car.position.z = (ci-1)*0.56; // spread cars front-to-back into a train
    cart.add(car);
  }
  // couplings linking the cars
  for(let ci=0;ci<2;ci++){
    const link = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.24,6), new THREE.MeshLambertMaterial({color:0xAEB4C7}));
    link.rotation.x = Math.PI/2;
    link.position.set(0, 0.14, (ci-0.5)*0.56);
    cart.add(link);
  }
  themeparkDecorGroup.add(cart);
  coasterCart = { mesh:cart, curve };

// ティーカップ — colorful cups that slowly spin in place
const teacups = [];
function makeCupStripeTexture(baseHex, accentHex){
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#' + baseHex.toString(16).padStart(6,'0');
  ctx.fillRect(0,0,128,64);
  ctx.fillStyle = '#' + accentHex.toString(16).padStart(6,'0');
  for(let i=-1;i<8;i++){
    ctx.beginPath();
    ctx.moveTo(i*16, 0);
    ctx.lineTo(i*16+8, 0);
    ctx.lineTo(i*16+16, 64);
    ctx.lineTo(i*16+8, 64);
    ctx.closePath();
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

// キャンディー・ロリポップの巨大オブジェ — twisted candy sculptures
function makeLollipopSwirlTexture(colorA, colorB){
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const cx = 128, cy = 128;
  const colorAHex = '#' + colorA.toString(16).padStart(6,'0');
  const colorBHex = '#' + colorB.toString(16).padStart(6,'0');
  // concentric rings, alternating colors, drawn largest-first so each
  // smaller circle paints cleanly over the previous ring
  const ringCount = 7;
  for(let i = ringCount; i >= 0; i--){
    const r = (i / ringCount) * 124;
    ctx.fillStyle = (i % 2 === 0) ? colorAHex : colorBHex;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fill();
  }
  return new THREE.CanvasTexture(canvas);
}

  ctx.roundRect ? ctx.roundRect(4,4,504,88,20) : ctx.rect(4,4,504,88);

  const outSign = new THREE.Mesh(new THREE.PlaneGeometry(4.4,0.85), new THREE.MeshBasicMaterial({map:tex, transparent:true}));

/* =========================================================
   MINIMAP (2D top-down view of the island, bottom-right corner)
========================================================= */
const minimapCanvas = document.getElementById('minimapCanvas');
const mmCtx = minimapCanvas ? minimapCanvas.getContext('2d') : null;
const WORLD_RADIUS = 34;
const BUILDING_SPOTS = [[-9,-9],[8,-2],[2,-16]];
const POND_SPOT = [-3,9];
const MM_SCALE = 58 / WORLD_RADIUS;

function worldToMap(x,z){
  return [75 + x*MM_SCALE, 75 + z*MM_SCALE];
}

function drawMinimap(){
  if(!mmCtx) return; // minimap UI removed
  mmCtx.clearRect(0,0,150,150);

  mmCtx.beginPath();
  mmCtx.arc(75,75,62,0,Math.PI*2);
  mmCtx.fillStyle = '#BFEFDD';
  mmCtx.fill();

  const [px,pz] = worldToMap(POND_SPOT[0], POND_SPOT[1]);
  mmCtx.beginPath();
  mmCtx.arc(px,pz,7,0,Math.PI*2);
  mmCtx.fillStyle = '#8FC7FF';
  mmCtx.fill();

  mmCtx.fillStyle = '#FFB3C1';
  BUILDING_SPOTS.forEach(([x,z])=>{
    const [mx,mz] = worldToMap(x,z);
    mmCtx.fillRect(mx-4, mz-4, 8, 8);
  });

  npcs.forEach(n=>{
    const [mx,mz] = worldToMap(n.mesh.position.x, n.mesh.position.z);
    mmCtx.beginPath();
    mmCtx.arc(mx,mz,4,0,Math.PI*2);
    mmCtx.fillStyle = '#' + n.def.color.toString(16).padStart(6,'0');
    mmCtx.fill();
  });

  landmarks.forEach(l=>{
    const [mx,mz] = worldToMap(l.group.position.x, l.group.position.z);
    mmCtx.font = '10px sans-serif';
    mmCtx.textAlign = 'center';
    mmCtx.textBaseline = 'middle';
    mmCtx.fillText(l.emoji, mx, mz);
  });

  const [ppx,ppz] = worldToMap(player.position.x, player.position.z);
  mmCtx.save();
  mmCtx.translate(ppx,ppz);
  mmCtx.rotate(-playerFacing);
  mmCtx.beginPath();
  mmCtx.moveTo(0,7);
  mmCtx.lineTo(-5,-5);
  mmCtx.lineTo(5,-5);
  mmCtx.closePath();
  mmCtx.fillStyle = '#F06A82';
  mmCtx.fill();
  mmCtx.restore();
}

/* =========================================================
   CHARACTER BUILDER (chibi rig: big head, small round body, shared by
   the player and every NPC — cat / bear / owl / rabbit variants)
========================================================= */
function makeCharacter({ bodyColor, earColor, earType }){
  const g = new THREE.Group();

  const toon = (c)=> new THREE.MeshToonMaterial({ color:c });
  const lighten = (hex, amt)=>{
    const r = Math.min(255, ((hex>>16)&255) + amt);
    const gr = Math.min(255, ((hex>>8)&255) + amt);
    const b = Math.min(255, (hex&255) + amt);
    return (r<<16)|(gr<<8)|b;
  };
  const bellyColor = lighten(bodyColor, 55);

  // small round sitting body
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5,20,16), toon(bodyColor));
  body.scale.set(1.0, 0.88, 0.95);
  body.position.y = 0.46;
  g.add(body);

  // cream belly patch
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12), toon(bellyColor));
  belly.scale.set(0.9,0.75,0.55);
  belly.position.set(0, 0.42, 0.32);
  g.add(belly);

  // paws (front, sitting pose)
  [-1,1].forEach(side=>{
    const paw = new THREE.Mesh(new THREE.SphereGeometry(0.14,12,10), toon(bodyColor));
    paw.position.set(side*0.24, 0.16, 0.42);
    g.add(paw);
  });

  // big chibi head (bigger than the body = cuter proportions)
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.72,22,18), toon(bodyColor));
  head.position.y = 1.3;
  g.add(head);

  // faint muzzle tint (kept subtle so the head still reads as one clean
  // round shape, like a flat kawaii-sticker cat rather than a snout)
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.22,16,12), toon(bellyColor));
  muzzle.scale.set(1,0.55,0.5);
  muzzle.position.set(0, 1.16, 0.6);
  g.add(muzzle);

  // ears vary by type
  if(earType === 'rabbit'){
    [-1,1].forEach(side=>{
      const earGeo = (typeof THREE.CapsuleGeometry === 'function')
        ? new THREE.CapsuleGeometry(0.13,0.5,4,8)
        : new THREE.CylinderGeometry(0.14,0.14,0.7,8);
      const ear = new THREE.Mesh(earGeo, toon(bodyColor));
      ear.position.set(side*0.26, 2.05, -0.02);
      ear.rotation.z = side*0.24;
      const earInner = new THREE.Mesh(new THREE.SphereGeometry(0.09,10,10), toon(earColor));
      earInner.position.set(side*0.26 + side*0.13, 2.35, 0.06);
      g.add(ear, earInner);
    });
  } else if(earType === 'cat'){
    [-1,1].forEach(side=>{
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.25,0.34,8), toon(bodyColor));
      ear.scale.set(1,1,0.5); // flatten front-to-back so it reads as a flat triangle
      ear.position.set(side*0.44, 2.02, -0.02);
      // straight up and perky, just the slightest outward angle
      ear.rotation.z = side*0.08;
      const earInner = new THREE.Mesh(new THREE.ConeGeometry(0.15,0.2,8), toon(earColor));
      earInner.scale.set(1,1,0.5);
      earInner.position.set(side*0.44, 1.99, 0.09);
      earInner.rotation.z = side*0.08;
      g.add(ear, earInner);
    });
    // nose + mouth, drawn as a small canvas decal so the mouth can be a
    // proper cute curved "w" smile rather than something built out of 3D
    // primitives
    const faceCanvas = document.createElement('canvas');
    faceCanvas.width = 100; faceCanvas.height = 60;
    const fctx = faceCanvas.getContext('2d');
    fctx.fillStyle = '#FF8FA3';
    fctx.beginPath();
    fctx.ellipse(50, 16, 7, 5, 0, 0, Math.PI*2);
    fctx.fill();
    fctx.strokeStyle = '#3A3450';
    fctx.lineWidth = 4;
    fctx.lineCap = 'round';
    fctx.beginPath();
    fctx.moveTo(50, 22);
    fctx.quadraticCurveTo(38, 38, 22, 24);
    fctx.stroke();
    fctx.beginPath();
    fctx.moveTo(50, 22);
    fctx.quadraticCurveTo(62, 38, 78, 24);
    fctx.stroke();
    const faceTex = new THREE.CanvasTexture(faceCanvas);
    const faceDecal = new THREE.Mesh(
      new THREE.PlaneGeometry(0.55, 0.33),
      new THREE.MeshBasicMaterial({ map:faceTex, transparent:true })
    );
    faceDecal.position.set(0, 1.14, 0.79);
    g.add(faceDecal);
    // whiskers — built as explicit line segments from a start point to
    // an end point (both given directly in local X/Y/Z), instead of
    // rotating a shape. This sidesteps rotation-sign math entirely, so
    // there's no way for left/right to accidentally end up identical.
    [-1,1].forEach(side=>{
      for(let i=0;i<3;i++){
        const yOff = (i-1)*0.06;
        const start = new THREE.Vector3(side*0.3, 1.2 - yOff, 0.62);
        const end   = new THREE.Vector3(side*0.66, 1.19 - yOff*1.3, 0.66);
        const whiskerGeo = new THREE.BufferGeometry().setFromPoints([start, end]);
        const whisker = new THREE.Line(whiskerGeo, new THREE.LineBasicMaterial({color:0xFFFFFF}));
        g.add(whisker);
      }
    });
    // tail: a few segments curving up and back
    const tailMat = toon(bodyColor);
    const seg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,0.56,8), tailMat);
    seg1.position.set(0, 0.6, -0.54);
    seg1.rotation.x = -1.15;
    const seg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.09,0.46,8), tailMat);
    seg2.position.set(0, 1.0, -0.82);
    seg2.rotation.x = -0.3;
    const tailTip = new THREE.Mesh(new THREE.SphereGeometry(0.08,10,10), toon(earColor));
    tailTip.position.set(0, 1.22, -0.66);
    g.add(seg1, seg2, tailTip);
  } else if(earType === 'bear'){
    [-1,1].forEach(side=>{
      const ear = new THREE.Mesh(new THREE.SphereGeometry(0.2,14,12), toon(bodyColor));
      ear.position.set(side*0.44, 1.8, -0.02);
      g.add(ear);
      const earInner = new THREE.Mesh(new THREE.SphereGeometry(0.11,10,10), toon(earColor));
      earInner.position.set(side*0.44, 1.8, 0.1);
      g.add(earInner);
    });
  } else if(earType === 'owl'){
    [-1,1].forEach(side=>{
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.13,0.2,4), toon(bodyColor));
      ear.position.set(side*0.26, 1.9, -0.05);
      g.add(ear);
    });
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.11,0.22,6), toon(0xFFD873));
    beak.rotation.x = Math.PI/2;
    beak.position.set(0, 1.18, 0.62);
    g.add(beak);
  }

  // cheeks
  [-1,1].forEach(side=>{
    const cheek = new THREE.Mesh(new THREE.CircleGeometry(0.13,12), new THREE.MeshBasicMaterial({color:0xFFB3C1}));
    cheek.position.set(side*0.42, 1.17, 0.6);
    cheek.rotation.y = side*-0.5;
    g.add(cheek);
  });

  // big simple round eyes (flat dots, closer to the clean line-art look)
  const eyeGeo = new THREE.CircleGeometry(0.115,16);
  const eyeMat = new THREE.MeshBasicMaterial({color:0x2E2A3A});
  [-1,1].forEach(side=>{
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(side*0.26, 1.36, 0.665);
    eye.rotation.y = side*-0.15;
    g.add(eye);
  });

  const shadow = makeBlobShadow(0.55);
  g.add(shadow);

  g.userData.head = head;
  g.userData.body = body;
  return g;
}

function spawnNPC(def){
  const mesh = makeCharacter({ bodyColor:def.color, earColor:def.earColor, earType:def.type });
  mesh.position.set(def.pos[0],0,def.pos[2]);

  // floating name + personality nameplate

  npCanvas.width = 256; npCanvas.height = 84;

  npCtx.fillStyle = 'rgba(74,59,92,0.72)';
  const rr = (x,y,w,h,r)=>{ npCtx.beginPath(); npCtx.moveTo(x+r,y); npCtx.arcTo(x+w,y,x+w,y+h,r); npCtx.arcTo(x+w,y+h,x,y+h,r); npCtx.arcTo(x,y+h,x,y,r); npCtx.arcTo(x,y,x+w,y,r); npCtx.closePath(); };
  rr(4,4,248,76,20);
  npCtx.fill();
  npCtx.textAlign = 'center';
  npCtx.fillStyle = '#FFFFFF';
  npCtx.font = '700 32px sans-serif';
  npCtx.fillText(def.name, 128, 38);
  npCtx.font = '600 20px sans-serif';
  npCtx.fillStyle = '#F3E8FF';

  const npTex = new THREE.CanvasTexture(npCanvas);
  const nameplate = new THREE.Sprite(new THREE.SpriteMaterial({ map:npTex, transparent:true }));
  nameplate.scale.set(1.1, 0.36, 1);
  nameplate.position.set(0, 2.5, 0);
  mesh.add(nameplate);

  // floating "!" marker
  const markerCanvas = document.createElement('canvas');
  markerCanvas.width = 64; markerCanvas.height = 64;
  const ctx = markerCanvas.getContext('2d');
  ctx.font = '700 46px sans-serif';
  ctx.fillStyle = '#F06A82';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('!', 32, 34);
  const tex = new THREE.CanvasTexture(markerCanvas);

function unlockAudio(){
  const ctx = getAudioCtx();
  if(ctx){
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    g.gain.value = 0.0001;
    osc.connect(g).connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.01);
  }

  if(!unlockAudioEl){
    unlockAudioEl = document.createElement('audio');
    unlockAudioEl.setAttribute('x-webkit-airplay', 'deny');
    unlockAudioEl.preload = 'auto';
    unlockAudioEl.loop = true;
    unlockAudioEl.volume = 0.01;
    unlockAudioEl.src = SILENT_WAV_DATA_URI;
    unlockAudioEl.play().catch(()=>{});
  }

  updateAudioDebug('unlock tried, ctx=' + (ctx ? ctx.state : 'none'));
}

let toneCallCount = 0;
function playTone(freq, duration, startTime, gain, type){
  const ctx = getAudioCtx();
  toneCallCount++;
  if(!ctx){ updateAudioDebug('no ctx, calls=' + toneCallCount); return; }
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + (startTime||0);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
  updateAudioDebug('state=' + ctx.state + ', calls=' + toneCallCount);
}

const clock = new THREE.Clock();

let playerFacing = 0;
const INTERACT_DIST = 2.6;

// returns [x,z] along the monorail loop at progress t (0..1)
function monorailPointAt(t){
  const totalSegs = monorailPoints.length - 1;
  const scaled = t * totalSegs;
  const i = Math.min(totalSegs-1, Math.floor(scaled));
  const localT = scaled - i;
  const [x1,z1] = monorailPoints[i], [x2,z2] = monorailPoints[i+1];
  return [x1 + (x2-x1)*localT, z1 + (z2-z1)*localT, Math.atan2(x2-x1, z2-z1)];
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // movement — walk toward moveTarget (set by tapping the ground) until
  // close enough, then stop. Much simpler than continuous stick input:
  // there's no direction vector to reinterpret every frame, so there's
  // no reference-frame or feedback-loop bug for the controls to hide in.
  let moving = false;
  if(moveTarget && !quizOpen && !rideActive){
    const dx = moveTarget.x - player.position.x;
    const dz = moveTarget.z - player.position.z;
    const dist = Math.hypot(dx, dz);
    if(dist > 0.15){
      moving = true;
      const targetAngle = Math.atan2(dx, dz);
      let diff = targetAngle - playerFacing;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      playerFacing += diff * Math.min(1, dt*6);
      const speed = Math.min(2.8, dist*4); // ease in as it arrives, no overshoot-jitter
      let step = Math.min(speed*dt, dist);
      if(inMazeMode) step = Math.min(step, 0.08); // extra-safe cap in the maze specifically
      const stepX = Math.sin(playerFacing) * step;
      const stepZ = Math.cos(playerFacing) * step;
      const PLAYER_RADIUS = 0.35;
      const x0 = player.position.x, z0 = player.position.z;
      if(!isMazeBlocked(x0 + stepX, z0 + stepZ, PLAYER_RADIUS)){
        // diagonal move is fully clear — most common case, no wall nearby
        player.position.x = x0 + stepX;
        player.position.z = z0 + stepZ;
      } else {
        // the diagonal destination hits something. Check each axis alone
        // (both from the ORIGINAL x0,z0, not chained). If exactly one
        // axis is clear on its own, slide along it. If BOTH are
        // individually clear, applying both together would silently
        // reconstruct the exact diagonal position we just found blocked
        // (a classic "corner-cutting" bug) — so in that ambiguous case,
        // and when both are blocked, don't move at all this frame.
        const xClear = !isMazeBlocked(x0 + stepX, z0, PLAYER_RADIUS);
        const zClear = !isMazeBlocked(x0, z0 + stepZ, PLAYER_RADIUS);
        if(xClear && !zClear) player.position.x = x0 + stepX;
        else if(zClear && !xClear) player.position.z = z0 + stepZ;
      }
      player.rotation.y = playerFacing;
      player.position.y = Math.abs(Math.sin(t*9))*0.06;

      footstepTimer += dt;
      if(footstepTimer > 0.32){
        footstepTimer = 0;
        playFootstepSound();
      }
    } else {
      moveTarget = null; // arrived
    }
  }
  if(!moving){
    player.position.y = Math.abs(Math.sin(t*2.4))*0.02;
    footstepTimer = 0.32; // next step plays right away when movement resumes
  }

  // fade out the tap marker after arrival
  if(tapMarker.visible){
    tapMarkerTimer += dt;
    const fadeStart = moveTarget ? 0 : 0; // start fading once stopped
    if(!moveTarget){
      tapMarker.scale.setScalar(1 + tapMarkerTimer*1.5);
      tapMarker.children[0].material.opacity = Math.max(0, 0.9 - tapMarkerTimer*2);
      if(tapMarkerTimer > 0.5){ tapMarker.visible = false; tapMarker.scale.setScalar(1); }
    }
  }

  // butterflies drifting in lazy loops
  butterflies.forEach(b=>{
    b.spr.position.x = b.baseX + Math.sin(t*0.6 + b.phase)*1.1;
    b.spr.position.z = b.baseZ + Math.cos(t*0.5 + b.phase)*1.1;
    b.spr.position.y = 1.2 + Math.sin(t*2.2 + b.phase)*0.15;
  });

  // npc idle bob + nearest check (NPCs and special landmarks share the interact button)
  let closest = null, closestDist = Infinity, closestKind = null;
  npcs.forEach(n=>{
    if(!n.mesh.visible) return; // belongs to a different world, not shown right now
    n.mesh.position.y = Math.abs(Math.sin(t*1.8 + n.def.pos[0]))*0.05;
    n.marker.position.y = 3.05 + Math.sin(t*3 + n.def.pos[0])*0.08;
    n.marker.visible = !allMastered(n);
    const dist = player.position.distanceTo(n.mesh.position);
    if(dist < closestDist){ closestDist = dist; closest = n; closestKind = 'npc'; }
  });
  landmarks.forEach(l=>{
    if(!l.group.visible) return;
    l.marker.position.y = l.marker.userData.baseY + Math.sin(t*2.5 + l.group.position.x)*0.1;
    if(l.ball) l.ball.rotation.y = t*0.6;
    if(l.star) l.star.rotation.y = t*0.8;
    const dist = player.position.distanceTo(l.group.position);
    if(dist < closestDist){ closestDist = dist; closest = l; closestKind = 'landmark'; }
  });
  const currentThreshold = (nearNPC || nearLandmark) ? INTERACT_DIST * 1.35 : INTERACT_DIST;
  if(closest && closestDist < currentThreshold){
    nearNPC = closestKind === 'npc' ? closest : null;
    nearLandmark = closestKind === 'landmark' ? closest : null;
    interactBtn.textContent = closestKind === 'npc' ? '💬 はなしかける' : closest.label;
    interactBtn.classList.add('show');
    if(!wasNearSomething) moveTarget = null; // stop only on first entering range, not every frame
    wasNearSomething = true;
  } else {
    nearNPC = null;
    nearLandmark = null;
    interactBtn.classList.remove('show');
    wasNearSomething = false;
  }
  if(nearNPC){
    const dx = player.position.x - nearNPC.mesh.position.x;
    const dz = player.position.z - nearNPC.mesh.position.z;
    nearNPC.mesh.rotation.y = Math.atan2(dx, dz);
  }

  // city-only animations (monorail car + hovering vehicles)
  if(cityGroup.visible){
    monorailT = (monorailT + dt*0.045) % 1;
    const [mx,mz,mAngle] = monorailPointAt(monorailT);
    monorailCar.position.x = mx;
    monorailCar.position.z = mz;
    monorailCar.rotation.y = -mAngle;
    hoverVehicles.forEach(v=>{
      v.mesh.position.y = v.baseY + Math.sin(t*1.2 + v.phase)*0.25;
      v.mesh.rotation.y = t*0.3 + v.phase;
    });
    digitalVisionScreens.forEach(tex=>{ tex.offset.x = (tex.offset.x + dt*0.08) % 1; });
  }

  checkMazeGoal();
  updateSkyPodRide(dt);
  updateCoasterRide(dt);
  if(themeparkDecorGroup.visible){
    if(ferrisWheel) ferrisWheel.rotation.z = t*0.15;
    if(carouselGroup){
      carouselGroup.rotation.y = t*0.5;
      carouselMounts.forEach(m=>{ m.mesh.position.y = m.baseY + Math.sin(t*2 + m.phase)*0.12; });
    }
    teacups.forEach(c=>{ c.mesh.rotation.y = t*1.2 + c.phase; });
    if(fountainWaterMat) fountainWaterMat.color.setHSL((t*0.08)%1, 0.65, 0.62);
    if(coasterCart){
      const ct = (t*0.03) % 1;
      const p = coasterCart.curve.getPointAt(ct);
      const tangent = coasterCart.curve.getTangentAt(ct);
      coasterCart.mesh.position.copy(p);
      coasterCart.mesh.rotation.y = Math.atan2(tangent.x, tangent.z);
      coasterCart.mesh.rotation.x = -Math.asin(Math.max(-1,Math.min(1,tangent.y)));
    }
  }

  // camera follow (third person, behind player)
  const camOffset = new THREE.Vector3(
    Math.sin(playerFacing) * -6.8,
    2.6,
    Math.cos(playerFacing) * -6.8
  );
  const desiredCamPos = player.position.clone().add(camOffset);
  camera.position.lerp(desiredCamPos, 1 - Math.pow(0.001, dt));
  const lookTarget = player.position.clone().add(new THREE.Vector3(0,1.1,0));
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  drawMinimap();
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function clusterByCategory(items){
  const byCat = {};
  items.forEach(v=>{
    (byCat[v.cat] = byCat[v.cat] || []).push(v);
  });
  const catNames = shuffle(Object.keys(byCat));
  const clusterSize = 4; // roughly how many same-topic words appear in a row
  const queue = [];
  catNames.forEach(cat=>{
    const words = shuffle(byCat[cat]);
    for(let i=0; i<words.length; i+=clusterSize){
      queue.push(words.slice(i, i+clusterSize));
    }
  });
  return shuffle(queue).flat();
}

/* =========================================================
   MINIGAME: ねこロードランナー (Cat Lode Runner)
   A small graph-based platformer: collect the word tiles for a
   sentence you've already mastered, in the correct order, while
   dodging a chasing mouse. Reuses VOCAB data directly — no separate
   content authoring needed, and only draws from words the player has
   already mastered, so this functions as spaced review rather than
   introducing new material.
========================================================= */
const LR = {}; // all game state lives here, reset each play

const LR_COLS = 8, LR_ROWS = 4;
const LR_LADDER_COLS = [1,3,5,7];
const LR_ROW_Y = [420,300,180,60]; // row 0 = bottom
const LR_COL_X = [50,150,250,350,450,550,650,750];

function lrNodeId(col,row){ return col+'_'+row; }

function lrBuildGraph(){
  const graph = {};
  for(let row=0; row<LR_ROWS; row++){
    for(let col=0; col<LR_COLS; col++){
      const id = lrNodeId(col,row);
      graph[id] = {
        col, row,
        x: LR_COL_X[col], y: LR_ROW_Y[row],
        left:  col>0 ? lrNodeId(col-1,row) : null,
        right: col<LR_COLS-1 ? lrNodeId(col+1,row) : null,
        up:    (LR_LADDER_COLS.includes(col) && row<LR_ROWS-1) ? lrNodeId(col,row+1) : null,
        down:  (LR_LADDER_COLS.includes(col) && row>0) ? lrNodeId(col,row-1) : null,
      };
    }
  }
  return graph;
}

function lrBfsPath(graph, fromId, toId){
  if(fromId === toId) return [];
  const visited = new Set([fromId]);
  const queue = [[fromId]];
  while(queue.length){
    const path = queue.shift();
    const cur = path[path.length-1];
    const node = graph[cur];
    for(const dir of ['left','right','up','down']){
      const next = node[dir];
      if(next && !visited.has(next)){
        const newPath = [...path, next];
        if(next === toId) return newPath.slice(1);
        visited.add(next);
        queue.push(newPath);
      }
    }
  }
  return [];
}

function lrPickSentence(){
  const pool = VOCAB.filter(v => masteredWords.has(v.en) && v.sentence && v.sentence.split(' ').length <= 7);
  if(pool.length === 0) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

function lrStart(){
  const item = lrPickSentence();
  const endPanel = document.getElementById('lrEndPanel');
  endPanel.classList.remove('show');
  endPanel.innerHTML = '';

  if(!item){
    endPanel.innerHTML = `<div class="lr-endcard">
      <div class="emoji">📚</div>
      <h3>まだあそべません</h3>
      <p>ことばをいくつか覚えてから、また来てね！</p>
      <button id="lrGiveUp">とじる</button>
    </div>`;
    endPanel.classList.add('show');
    document.getElementById('lrGiveUp').onclick = lrClose;
    return;
  }

  const graph = lrBuildGraph();
  const tokens = item.sentence.split(' ');
  const allNodeIds = Object.keys(graph);
  const startId = lrNodeId(0,0);
  const enemyStartId = lrNodeId(LR_COLS-1, LR_ROWS-1);

  // pick distinct nodes (not the two start spots) for word tiles: one
  // per sentence token, plus a couple of decoy words from other vocab
  const candidateNodes = shuffle(allNodeIds.filter(id => id!==startId && id!==enemyStartId));
  const decoyPool = shuffle(VOCAB.filter(v=>v.en!==item.en && v.sentence)).slice(0,4);
  const decoyWords = shuffle(decoyPool.flatMap(v=>v.sentence.split(' '))).slice(0, Math.min(2, Math.max(0, candidateNodes.length - tokens.length)));

  const tileWords = shuffle([...tokens.map((w,i)=>({word:w, correctIndex:i, isDecoy:false})), ...decoyWords.map(w=>({word:w, correctIndex:-1, isDecoy:true}))]);
  const tiles = tileWords.map((tw, i) => ({
    ...tw,
    nodeId: candidateNodes[i],
    collected: false,
  })).filter(t => t.nodeId);

  LR.item = item;
  LR.tokens = tokens;
  LR.graph = graph;
  LR.tiles = tiles;
  LR.collectedOrder = [];
  LR.nextIndex = 0;
  LR.lives = 3;
  LR.playerNode = startId;
  LR.playerPos = { ...graph[startId] };
  LR.playerMoving = false;
  LR.enemyNode = enemyStartId;
  LR.enemyPos = { ...graph[enemyStartId] };
  LR.enemyPath = [];
  LR.enemyMoveTimer = 0;
  LR.invincibleTimer = 0;
  LR.won = false;
  LR.input = { left:false, right:false, up:false, down:false };

  document.getElementById('lrSentenceJa').textContent = item.sentenceJa;
  lrUpdateProgress();
  lrUpdateLives();

  if(!LR.loopRunning){
    LR.loopRunning = true;
    requestAnimationFrame(lrLoop);
  }
}

function lrUpdateProgress(){
  const parts = LR.tokens.map((w,i)=> i < LR.collectedOrder.length ? w : '＿');
  document.getElementById('lrProgress').textContent = parts.join(' ');
}
function lrUpdateLives(){
  document.getElementById('lrLives').textContent = '❤️'.repeat(Math.max(0,LR.lives)) + '🤍'.repeat(Math.max(0,3-LR.lives));
}

function lrOpen(){
  document.getElementById('loderunnerOverlay').classList.add('show');
  lrStart();
}
function lrClose(){
  document.getElementById('loderunnerOverlay').classList.remove('show');
  LR.won = true; // stop gameplay updates while closed
}

document.getElementById('loderunnerCard').addEventListener('click', lrOpen);
document.getElementById('lrCloseBtn').addEventListener('click', lrClose);

// touch d-pad
function lrBindHold(id, key){
  const el = document.getElementById(id);
  const set = (v)=> LR.input && (LR.input[key] = v);
  el.addEventListener('pointerdown', e=>{
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); } catch(err){}
    set(true);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=> el.addEventListener(ev, ()=> set(false)));
}
lrBindHold('lrLeft','left');
lrBindHold('lrRight','right');
lrBindHold('lrUp','up');
lrBindHold('lrDown','down');

// safety net: if a touch/click release is ever missed by the buttons
// above (a known source of "stuck" held-down input on touch devices),
// force-clear all D-pad state on any release or focus loss anywhere
function lrClearInput(){
  if(LR.input){ LR.input.left = LR.input.right = LR.input.up = LR.input.down = false; }
}
window.addEventListener('pointercancel', lrClearInput);
window.addEventListener('blur', lrClearInput);

const LR_MOVE_TIME = 0.24; // seconds to glide between adjacent nodes
const LR_ENEMY_STEP_TIME = 0.85;

function lrLoop(ts){
  requestAnimationFrame(lrLoop);
  const overlay = document.getElementById('loderunnerOverlay');
  if(!overlay.classList.contains('show')) return;
  if(!LR.graph) return;

  const now = ts/1000;
  const dt = Math.min(0.05, now - (LR._lastTs || now));
  LR._lastTs = now;

  if(!LR.won){
    lrUpdatePlayer(dt);
    lrUpdateEnemy(dt);
    lrCheckCollisions();
  }
  lrDraw();
}

function lrUpdatePlayer(dt){
  if(!LR.playerMoving){
    const node = LR.graph[LR.playerNode];
    let dir = null;
    if(LR.input.left && node.left) dir = 'left';
    else if(LR.input.right && node.right) dir = 'right';
    else if(LR.input.up && node.up) dir = 'up';
    else if(LR.input.down && node.down) dir = 'down';
    if(dir){
      const targetId = node[dir];
      LR.playerFrom = { ...node };
      LR.playerTo = { ...LR.graph[targetId] };
      LR.playerNode = targetId;
      LR.playerMoving = true;
      LR.playerMoveT = 0;
      LR.playerFacing = (dir==='left') ? -1 : (dir==='right' ? 1 : LR.playerFacing||1);
    }
  } else {
    LR.playerMoveT += dt / LR_MOVE_TIME;
    if(LR.playerMoveT >= 1){
      LR.playerMoveT = 1;
      LR.playerMoving = false;
      LR.playerPos = { ...LR.playerTo };
    } else {
      // ease-in-out instead of linear, for smoother-looking motion
      const e = LR.playerMoveT < 0.5
        ? 2*LR.playerMoveT*LR.playerMoveT
        : 1 - Math.pow(-2*LR.playerMoveT + 2, 2) / 2;
      LR.playerPos = {
        x: LR.playerFrom.x + (LR.playerTo.x - LR.playerFrom.x)*e,
        y: LR.playerFrom.y + (LR.playerTo.y - LR.playerFrom.y)*e - Math.sin(e*Math.PI)*4,
      };
    }
  }
  if(LR.invincibleTimer > 0) LR.invincibleTimer -= dt;
}

function lrUpdateEnemy(dt){
  LR.enemyMoveTimer += dt;
  if(LR.enemyMoveTimer < LR_ENEMY_STEP_TIME) return;
  LR.enemyMoveTimer = 0;

  if(LR.enemyPath.length === 0){
    LR.enemyPath = lrBfsPath(LR.graph, LR.enemyNode, LR.playerNode);
  }
  const nextId = LR.enemyPath.shift();
  if(nextId){
    LR.enemyNode = nextId;
    LR.enemyPos = { ...LR.graph[nextId] };
  }
}

function lrCheckCollisions(){
  // tile collection: only the correct next word can be picked up
  for(const tile of LR.tiles){
    if(tile.collected) continue;
    if(tile.nodeId !== LR.playerNode) continue;
    if(tile.correctIndex === LR.nextIndex){
      tile.collected = true;
      LR.collectedOrder.push(tile.word);
      LR.nextIndex++;
      playCorrectSound();
      lrUpdateProgress();
      if(LR.nextIndex >= LR.tokens.length){
        lrWin();
      }
    }
    // wrong-order or decoy tiles: no penalty, just don't collect —
    // encourages exploration without punishing curiosity
  }

  // enemy contact
  if(LR.invincibleTimer <= 0){
    const dx = LR.playerPos.x - LR.enemyPos.x, dy = LR.playerPos.y - LR.enemyPos.y;
    if(Math.hypot(dx,dy) < 40){
      LR.lives--;
      LR.invincibleTimer = 1.5;
      lrUpdateLives();
      playWrongSound();
      if(LR.lives <= 0) lrLose();
    }
  }
}

function lrWin(){
  LR.won = true;
  markMastered(LR.item); // small reinforcement bonus (no-op mastery-wise, already mastered)
  addCoins(8);
  const endPanel = document.getElementById('lrEndPanel');
  endPanel.innerHTML = `<div class="lr-endcard">
    <div class="emoji">🎉</div>
    <h3>クリア！</h3>

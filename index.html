<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ねこじま - 英検準2級 3Dたんぼ歩き</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap');

:root{
  --coral:#FF8FA3; --coral-deep:#F06A82;
  --mint:#6FE0C2; --mint-deep:#3FC7A6;
  --sunshine:#FFD873; --sunshine-deep:#F5B942;
  --lavender:#B9A6E8; --lavender-deep:#9A82D6;
  --plum:#4A3B5C; --plum-soft:#7A6A93;
  --card:#FFFFFF;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:'M PLUS Rounded 1c', sans-serif; background:#CFEFFF;}
#gameCanvas{position:fixed; inset:0; display:block; touch-action:none;}

/* ---------- HUD TOP ---------- */
.hud-top{
  position:fixed; top:14px; left:14px; right:14px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
  z-index:20; pointer-events:none;
}
.jar-wrap{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,0.82); backdrop-filter:blur(6px);
  border-radius:999px; padding:6px 18px 6px 6px;
  box-shadow:0 4px 14px rgba(122,106,147,0.2);
  pointer-events:auto;
}
.jar-svg{width:44px; height:44px; display:block;}
.jar-label{display:flex; flex-direction:column; line-height:1.1;}
.jar-label .title{font-size:11px; color:var(--plum-soft); font-weight:700;}
.jar-label .count{font-family:'Fredoka',sans-serif; font-size:18px; font-weight:600; color:var(--plum);}

.hint-pill{
  background:rgba(74,59,92,0.72); color:#fff; font-size:12.5px; font-weight:700;
  padding:9px 16px; border-radius:999px; max-width:60%; text-align:center;
  transition:opacity .5s ease; pointer-events:none;
}
.hint-pill.hide{opacity:0;}

/* ---------- JOYSTICK ---------- */
#joyBase{
  position:fixed; left:0; top:0; width:130px; height:130px;
  margin-left:-65px; margin-top:-65px;
  border-radius:50%; background:rgba(255,255,255,0.35); border:3px solid rgba(255,255,255,0.55);
  z-index:25; touch-action:none; pointer-events:none;
  opacity:0; transition:opacity .15s ease;
}
#joyBase.show{ opacity:1; }
#joyStick{
  position:absolute; left:50%; top:50%; width:48px; height:48px; border-radius:50%;
  background:rgba(255,255,255,0.9); box-shadow:0 3px 10px rgba(74,59,92,0.3);
  transform:translate(-50%,-50%);
}

/* ---------- INTERACT BUTTON ---------- */
#interactBtn{
  position:fixed; right:30px; bottom:96px; z-index:25;
  background:linear-gradient(135deg, var(--coral), var(--coral-deep));
  color:#fff; border:none; border-radius:999px; padding:16px 22px;
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:15px;
  box-shadow:0 6px 18px rgba(240,106,130,0.45);
  opacity:0; transform:translateY(12px) scale(0.9); pointer-events:none;
  transition:all .2s ease;
}
#interactBtn.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
#interactBtn:active{transform:scale(0.94);}

/* ---------- QUIZ OVERLAY ---------- */
#quizOverlay{
  position:fixed; inset:0; z-index:60; display:none;
  align-items:center; justify-content:center;
  background:rgba(74,59,92,0.45); backdrop-filter:blur(3px);
}
#quizOverlay.show{display:flex;}
.quiz-card{
  width:min(94vw, 560px); background:var(--card); border-radius:28px;
  padding:28px 26px 30px; box-shadow:0 20px 50px rgba(0,0,0,0.28);
  display:flex; flex-direction:column; align-items:center; gap:14px;
  border:3px solid transparent; transition:border-color .2s ease;
  position:relative;
  max-height:88vh; overflow-y:auto;
}
.quiz-card.flash-good{border-color:var(--mint-deep);}
.quiz-card.flash-bad{border-color:var(--coral-deep); animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

.npc-header{display:flex; align-items:center; gap:12px; align-self:flex-start; width:100%; padding-right:44px;}
#npcProfileBtn{
  background:#FBF9FF; border:2px solid #ECE5FA; border-radius:50%; width:38px; height:38px;
  font-size:18px; cursor:pointer; flex-shrink:0;
}
#npcProfileOverlay{
  position:fixed; inset:0; z-index:85; display:none;
  align-items:center; justify-content:center;
  background:rgba(74,59,92,0.5); backdrop-filter:blur(3px);
}
#npcProfileOverlay.show{ display:flex; }
.npc-avatar{width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px;}
.npc-name{font-weight:800; color:var(--plum); font-size:19px;}
.npc-sub{font-size:14px; color:var(--plum-soft); font-weight:700;}
.dialogue-bubble{
  align-self:flex-start; max-width:92%; background:#F1F3FF; border-radius:16px 16px 16px 4px;
  padding:14px 18px; font-size:17px; font-weight:700; color:var(--plum);
}
.dialogue-bubble .en{ font-family:'Fredoka',sans-serif; font-size:22px; }
.dialogue-bubble .ja{ display:block; font-size:15px; color:var(--plum-soft); font-weight:700; margin-top:6px; }
.reply-label{font-size:13.5px; font-weight:800; color:var(--mint-deep); align-self:flex-end;}
.reaction-bubble{
  align-self:flex-start; max-width:92%; background:linear-gradient(135deg,#FFF3EC,#FFE8D9); border-radius:16px 16px 16px 4px;
  padding:14px 18px; font-size:17px; font-weight:700; color:var(--plum); margin-top:2px;
}
.reaction-bubble .en{ font-family:'Fredoka',sans-serif; font-size:20px; }
.reaction-bubble .ja{ display:block; font-size:14.5px; color:var(--plum-soft); font-weight:700; margin-top:6px; }

.prompt-label{font-size:14px; font-weight:700; color:var(--plum-soft);}
.prompt-main{display:flex; align-items:center; gap:12px; justify-content:center; min-height:60px; text-align:center;}
.en-word{font-family:'Fredoka',sans-serif; font-size:clamp(28px,7vw,36px); font-weight:600; color:var(--plum);}
.speak-btn{
  width:50px; height:50px; border-radius:50%; border:none;
  background:linear-gradient(135deg, var(--mint), var(--mint-deep));
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 4px 10px rgba(63,199,166,0.4); flex-shrink:0;
}
.speak-btn svg{width:24px; height:24px;}

.npc-speech{font-size:14px; font-weight:800; color:var(--plum-soft); align-self:flex-start;}
.sentence-line{font-family:'Fredoka',sans-serif; font-size:clamp(22px,5.5vw,28px); font-weight:600; color:var(--plum); text-align:center; line-height:1.55;}
.blank-slot{display:inline-block; min-width:76px; padding:2px 8px; border-bottom:4px solid var(--lavender-deep); color:var(--lavender-deep); font-weight:700;}
.blank-slot.filled-correct{color:var(--mint-deep); border-color:var(--mint-deep);}
.blank-slot.filled-wrong{color:var(--coral-deep); border-color:var(--coral-deep);}
.ja-hint{font-size:15px; color:var(--plum-soft); font-weight:700; text-align:center;}
.exercise-tag{font-size:12px; font-weight:800; color:#fff; padding:4px 12px; border-radius:999px; align-self:flex-start;}
.exercise-tag.blank{background:var(--lavender-deep);}
.exercise-tag.order{background:var(--sunshine-deep); color:#6b4a00;}

.build-line{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-content:flex-start; min-height:56px; width:100%; padding:12px; background:#FBF9FF; border-radius:16px; border:2px dashed #ECE5FA;}
.build-chip{background:linear-gradient(135deg, var(--lavender), var(--lavender-deep)); color:#fff; padding:10px 16px; border-radius:12px; font-weight:700; font-size:16px; cursor:pointer; border:none; font-family:'Fredoka',sans-serif;}
.build-chip.correct{background:linear-gradient(135deg, var(--mint), var(--mint-deep));}
.build-chip.wrong{background:linear-gradient(135deg, var(--coral), var(--coral-deep));}
.build-chip.locked{pointer-events:none;}

.chip-pool{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%;}
.chip{background:#FBF9FF; border:2px solid #ECE5FA; color:var(--plum); padding:10px 16px; border-radius:12px; font-weight:700; font-size:16px; cursor:pointer; font-family:'Fredoka',sans-serif; transition:all .15s ease;}
.chip:active{transform:scale(0.95);}

.sentence-answer{font-size:14.5px; color:var(--mint-deep); font-weight:700; text-align:center;}
.feedback-banner{
  align-self:center; text-align:center; font-family:'Fredoka',sans-serif; font-weight:700;
  font-size:19px; padding:8px 18px; border-radius:999px; animation:feedbackPop .3s ease;
}
.feedback-banner .ja{ font-family:'M PLUS Rounded 1c',sans-serif; font-size:13px; margin-left:6px; }
.feedback-banner.correct{ background:linear-gradient(135deg, var(--mint), var(--mint-deep)); color:#fff; }
.feedback-banner.wrong{ background:linear-gradient(135deg, var(--coral), var(--coral-deep)); color:#fff; }
@keyframes feedbackPop{
  0%{ transform:scale(0.7); opacity:0; }
  70%{ transform:scale(1.08); opacity:1; }
  100%{ transform:scale(1); }
}

.omikuji-btn{
  font-size:64px; background:none; border:none; cursor:pointer; padding:10px;
  animation:omikujiPulse 1.6s ease-in-out infinite;
}
@keyframes omikujiPulse{
  0%,100%{ transform:scale(1) rotate(-4deg); }
  50%{ transform:scale(1.08) rotate(4deg); }
}
.omikuji-result{
  font-family:'Fredoka',sans-serif; font-size:36px; font-weight:700; color:var(--lavender-deep);
  animation:omikujiReveal .35s ease;
}
@keyframes omikujiReveal{
  0%{ transform:scale(0.4); opacity:0; }
  70%{ transform:scale(1.12); opacity:1; }
  100%{ transform:scale(1); }
}

.choices{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%;}
.choice-btn{
  background:#FBF9FF; border:2px solid #ECE5FA; border-radius:16px; padding:16px 10px;
  font-family:'M PLUS Rounded 1c',sans-serif; font-size:17px; font-weight:700; color:var(--plum);
  cursor:pointer; transition:all .15s ease; text-align:center;
}
.choice-btn.correct{background:linear-gradient(135deg, var(--mint), var(--mint-deep)); border-color:var(--mint-deep); color:#fff;}
.choice-btn.wrong{background:linear-gradient(135deg, var(--coral), var(--coral-deep)); border-color:var(--coral-deep); color:#fff;}
.choice-btn.disabled{pointer-events:none; opacity:0.6;}
.choice-btn.disabled.correct, .choice-btn.disabled.wrong{opacity:1;}

.quiz-footer-btn{
  margin-top:4px; background:linear-gradient(135deg, var(--coral), var(--coral-deep)); color:#fff; border:none;
  border-radius:999px; padding:14px 34px; font-weight:800; font-size:16px; cursor:pointer;
  box-shadow:0 6px 16px rgba(240,106,130,0.4);
  opacity:0; transform:translateY(8px); pointer-events:none; transition:all .25s ease;
}
.quiz-footer-btn.show{opacity:1; transform:translateY(0); pointer-events:auto;}
.close-x{position:absolute; top:16px; right:18px; background:none; border:none; font-size:26px; color:var(--plum-soft); cursor:pointer; padding:6px; line-height:1;}

.npc-done-panel{display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px 0;}
.thinking-emoji{ animation:thinkBounce 1s ease-in-out infinite; }
@keyframes thinkBounce{
  0%,100%{ transform:translateY(0) rotate(-4deg); }
  50%{ transform:translateY(-8px) rotate(4deg); }
}
.thinking-dots span{ display:inline-block; animation:thinkDot 1.4s ease-in-out infinite; }
.thinking-dots span:nth-child(2){ animation-delay:.2s; }
.thinking-dots span:nth-child(3){ animation-delay:.4s; }
@keyframes thinkDot{
  0%,60%,100%{ opacity:0.2; transform:translateY(0); }
  30%{ opacity:1; transform:translateY(-3px); }
}
.npc-done-panel .emoji{font-size:44px;}
.npc-done-panel p{margin:0; color:var(--plum-soft); font-size:13px; text-align:center; font-weight:700;}

.sparkle{position:fixed; pointer-events:none; font-size:20px; z-index:70; animation:sparkleFly .9s ease-out forwards;}
@keyframes sparkleFly{0%{transform:translate(0,0) scale(0.4) rotate(0deg); opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(180deg); opacity:0;}}
</style>
</head>
<body>

<div id="errBanner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:999; background:#F06A82; color:#fff; font:12px/1.4 monospace; padding:10px 14px; white-space:pre-wrap; max-height:40vh; overflow:auto;"></div>
<script>
  window.addEventListener('error', function(e){
    var el = document.getElementById('errBanner');
    el.style.display = 'block';
    el.textContent += 'ERROR: ' + e.message + '  (line ' + e.lineno + ')\n';
  });
  window.addEventListener('unhandledrejection', function(e){
    var el = document.getElementById('errBanner');
    el.style.display = 'block';
    el.textContent += 'PROMISE ERROR: ' + e.reason + '\n';
  });
</script>

<canvas id="gameCanvas"></canvas>

<div class="hud-top">
  <div class="jar-wrap">
    <svg class="jar-svg" viewBox="0 0 64 64">
      <path d="M20 14 L20 10 Q20 6 24 6 L40 6 Q44 6 44 10 L44 14" fill="none" stroke="#C9A96E" stroke-width="3" stroke-linecap="round"/>
      <rect x="17" y="12" width="30" height="6" rx="2" fill="#C9A96E"/>
      <path d="M19 18 Q17 18 17 21 L15 52 Q15 58 22 58 L42 58 Q49 58 49 52 L47 21 Q47 18 45 18 Z" fill="#E9F7FF" stroke="#CFE7F5" stroke-width="1.5"/>
      <g id="jarOrbs"></g>
    </svg>
    <div class="jar-label">
      <span class="title">ことだまジャー <span id="levelBadge" class="level-badge">Lv.1</span></span>
      <span class="count"><span id="wordCount">0</span> / <span id="wordTotal">0</span></span>
    </div>
  </div>
  <div class="daily-wrap">
    <span>📅 <span id="dailyCount">0</span>/<span id="dailyGoalLabel">15</span></span>
    <span>🔥<span id="streakCount">0</span>日</span>
  </div>
  <div class="coin-wrap">
    <span class="coin-icon">🪙</span>
    <span class="coin-count" id="coinCount">0</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
    <span style="font-family:'Fredoka',sans-serif; font-weight:700; font-size:15px; color:#fff; text-shadow:0 2px 6px rgba(74,59,92,0.35); pointer-events:none;">🐾 ねこじま</span>
    <div class="hint-pill" id="hintPill">スティックで歩いて、NPCに近づいてね</div>
  </div>
</div>

<div id="joyBase"><div id="joyStick"></div></div>
<button id="interactBtn">💬 はなしかける</button>

<div id="minimapWrap">
  <button id="dayNightBtn">🌙 よる</button>
  <button id="islandBadge">🌳 はじまりの島</button>
  <button id="myCodeBtn">🔑 マイコード</button>
  <canvas id="minimapCanvas" width="150" height="150"></canvas>
  <span class="minimap-label">🐾 ねこ島</span>
</div>
<button id="addNpcBtn">🐾＋ なかまをつくる</button>
<button id="reviewBtn">📖 復習ノート<span id="mistakeBadge" class="mistake-badge"></span></button>
<button id="rewardsBtn">🎁 ごほうび</button>

<div id="islandOverlay">
  <div class="npc-create-card" style="max-width:360px;">
    <button class="close-x" id="closeIslandOverlay">✕</button>
    <h2>🏝️ 島マップ</h2>
    <p class="reward-sub">ことばを覚えると、あたらしい島に行けるようになるよ！</p>
    <div id="islandList"></div>
  </div>
</div>

<div id="npcCreateOverlay">
  <div class="npc-create-card">
    <button class="close-x" id="closeNpcCreate">✕</button>
    <h2>あたらしい なかまをつくろう</h2>

    <label class="nc-label">なまえ</label>
    <input type="text" id="ncName" maxlength="8" placeholder="例: みかん" class="nc-input">

    <label class="nc-label">どうぶつ</label>
    <div class="nc-row" id="ncTypeRow">
      <button class="nc-choice active" data-type="cat">🐱 ねこ</button>
      <button class="nc-choice" data-type="bear">🐻 くま</button>
      <button class="nc-choice" data-type="owl">🦉 ふくろう</button>
      <button class="nc-choice" data-type="rabbit">🐰 うさぎ</button>
    </div>

    <label class="nc-label">いろ</label>
    <div class="nc-row" id="ncColorRow"></div>

    <label class="nc-label">せいかく</label>
    <div class="nc-row" id="ncPersonalityRow">
      <button class="nc-choice active" data-p="げんき">げんき</button>
      <button class="nc-choice" data-p="のんびり">のんびり</button>
      <button class="nc-choice" data-p="クール">クール</button>
      <button class="nc-choice" data-p="やさしい">やさしい</button>
    </div>

    <label class="nc-label">おしえてくれることば</label>
    <div class="nc-row" id="ncCatRow"></div>

    <label class="nc-label">ひとことプロフィール（にんい）</label>
    <textarea id="ncBio" maxlength="60" placeholder="例: あまいものが大好きなカフェ店員" class="nc-input" rows="2" style="resize:none;"></textarea>

    <button class="quiz-footer-btn show" id="ncCreateBtn" style="margin-top:6px;">この子をつくる！</button>
  </div>
</div>

  position:fixed; top:14px; right:14px; z-index:22;
  background:rgba(255,255,255,0.82); backdrop-filter:blur(6px);

  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:12.5px; color:var(--plum);

}

  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:12.5px; color:var(--plum);

#rewardsBtn{ top:106px; }

}

}

.coin-count{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:15px; color:var(--plum); }

}

#minimapCanvas{
  width:120px; height:120px; border-radius:50%;

.minimap-label{
  font-family:'Fredoka',sans-serif; font-weight:700; font-size:11px; color:var(--plum);

}
#dayNightBtn{

  box-shadow:0 4px 14px rgba(122,106,147,0.2); cursor:pointer;
}
#islandBadge, #myCodeBtn{
  pointer-events:auto;

  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:12px; color:var(--plum);
  box-shadow:0 4px 14px rgba(122,106,147,0.2); cursor:pointer;
}

}

<script>
/* =========================================================
   BACKEND WIRING
   This game was built inside a Claude.ai artifact, where
   `window.storage` and direct AI API calls are proxied automatically.
   Outside that sandbox (i.e. once hosted), neither exists — so this
   section replaces both with calls to our own Vercel API functions (see
   /api), which talk to Supabase (save data) and the real Google Gemini
   API (sentence generation) using credentials kept server-side.
========================================================= */
const PLAYER_CODE_KEY = 'neko_player_code';

function getPlayerCode(){ return localStorage.getItem(PLAYER_CODE_KEY); }
function setPlayerCode(code){ localStorage.setItem(PLAYER_CODE_KEY, code); }

function generatePlayerCode(){
  const words = ['ねこ','みかん','さくら','ほし','つき','うみ','もも','くも','はな','ゆき'];
  const w = words[Math.floor(Math.random()*words.length)];
  const n = Math.floor(1000 + Math.random()*9000);
  return `${w}-${n}`;
}

// drop-in replacement for the artifact's window.storage.get/set,
// backed by our own save-data / load-data Vercel API functions
const remoteStorage = {
  async get(key){
    const code = getPlayerCode();
    if(!code) return null;
    try{
      const res = await fetch(`/api/load-data?code=${encodeURIComponent(code)}&key=${encodeURIComponent(key)}`);
      if(!res.ok) return null;
      const json = await res.json();
      if(json.value === null || json.value === undefined) return null;
      return { key, value: json.value };
    } catch(e){ return null; }
  },
  async set(key, value){
    const code = getPlayerCode();
    if(!code) return null;
    try{
      const res = await fetch('/api/save-data', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ code, key, value }),
      });
      if(!res.ok) return null;
      return { key, value };
    } catch(e){ return null; }
  }
};
// keep the rest of the game's code unchanged — it already calls
// `window.storage.get/set`, so we just point that name at our shim
window.storage = remoteStorage;

// sends a prompt to our generate-sentence Vercel API function, which
// forwards it to the real Gemini API using a server-side key
async function callClaudeProxy(prompt){
  const res = await fetch('/api/generate-sentence', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ prompt }),
  });
  if(!res.ok){
    let detail = '';
    try{ detail = await res.text(); } catch(e){}
    console.error('generate-sentence backend error:', res.status, detail);
    throw new Error('proxy request failed: ' + res.status);
  }
  return res.json();
}

function showCodeReveal(code){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; background:rgba(74,59,92,0.55); font-family:"M PLUS Rounded 1c",sans-serif;';
  overlay.innerHTML = `
    <div style="background:#fff; border-radius:26px; padding:28px 26px; max-width:340px; width:88vw; box-shadow:0 20px 50px rgba(0,0,0,0.25); text-align:center;">
      <div style="font-size:36px;">📝</div>
      <p style="font-size:13px; color:#7A6A93; font-weight:700; margin:6px 0 12px;">きみのセーブコードだよ。メモしておいてね！</p>
      <div style="font-family:'Fredoka',sans-serif; font-size:26px; font-weight:700; color:#4A3B5C; background:#FBF9FF; border:2px dashed #ECE5FA; border-radius:14px; padding:14px; margin-bottom:16px;">${code}</div>
      <button id="codeRevealOk" style="width:100%; padding:12px; border:none; border-radius:999px; background:linear-gradient(135deg,#FF8FA3,#F06A82); color:#fff; font-weight:800; font-size:14px; cursor:pointer;">わかった！</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#codeRevealOk').onclick = ()=> overlay.remove();
}

document.getElementById('myCodeBtn').addEventListener('click', ()=>{
  const code = getPlayerCode();
  if(code) showCodeReveal(code);
});
function ensurePlayerCode(){
  return new Promise(resolve=>{
    const existing = getPlayerCode();
    if(existing){ resolve(existing); return; }

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed; inset:0; z-index:999; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#CFEFFF,#F3E8FF); font-family:"M PLUS Rounded 1c",sans-serif;';
    overlay.innerHTML = `
      <div style="background:#fff; border-radius:26px; padding:28px 26px; max-width:360px; width:90vw; box-shadow:0 20px 50px rgba(0,0,0,0.2); text-align:center;">
        <div style="font-size:44px;">🐾</div>
        <h2 style="font-family:'Fredoka',sans-serif; color:#4A3B5C; margin:8px 0 4px;">ねこじまへ ようこそ！</h2>
        <p style="font-size:13px; color:#7A6A93; font-weight:700; margin:0 0 18px;">セーブコードで、どの端末でも つづきから あそべるよ。</p>
        <button id="pcNewBtn" style="width:100%; padding:14px; border:none; border-radius:999px; background:linear-gradient(135deg,#FF8FA3,#F06A82); color:#fff; font-weight:800; font-size:14px; cursor:pointer; margin-bottom:10px;">✨ あたらしく はじめる</button>
        <div style="font-size:11px; color:#7A6A93; font-weight:700; margin:12px 0 6px;">もう コードを持っている子は↓</div>
        <input id="pcInput" type="text" placeholder="例: ねこ-1234" style="width:100%; box-sizing:border-box; padding:12px; border-radius:12px; border:2px solid #ECE5FA; font-size:14px; text-align:center; margin-bottom:10px;">
        <button id="pcContinueBtn" style="width:100%; padding:12px; border:none; border-radius:999px; background:#FBF9FF; border:2px solid #ECE5FA; color:#4A3B5C; font-weight:800; font-size:13px; cursor:pointer;">このコードで つづける</button>
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.querySelector('#pcNewBtn').onclick = ()=>{
      const code = generatePlayerCode();
      setPlayerCode(code);
      overlay.remove();
      showCodeReveal(code);
      resolve(code);
    };
    overlay.querySelector('#pcContinueBtn').onclick = ()=>{
      const val = overlay.querySelector('#pcInput').value.trim();
      if(!val) return;
      setPlayerCode(val);
      overlay.remove();
      resolve(val);
    };
  });
}

/* ---------- daily quota + streak + level ---------- */
const DAILY_GOAL = 15;

let lastGoalDate = null;   // 'YYYY-MM-DD' — last date the goal of 15 was reached

let lastKnownLevel = 1;

function todayStr(){ return new Date().toISOString().slice(0,10); }
function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
const WORDS_PER_LEVEL = 25;
function getLevel(){ return 1 + Math.floor(masteredWords.size / WORDS_PER_LEVEL); }

function checkDailyRollover(){
  const t = todayStr();
  if(lastPlayDate !== t){
    dailyCount = 0;
    lastPlayDate = t;
  }
}

function recordDailyProgress(){
  checkDailyRollover();
  dailyCount++;
  if(dailyCount === DAILY_GOAL){
    if(lastGoalDate === yesterdayStr()) streak++;
    else if(lastGoalDate !== todayStr()) streak = 1;
    lastGoalDate = todayStr();
    addCoins(10);
    showToast(`🎉 今日の目標（15問）は達成したよ！（${streak}日れんぞく）でも… Keep going! 🐾 ボーナス +10🪙`);
  }
  updateDailyHUD();
  saveProgress();
}

  checkDailyRollover();
  const dEl = document.getElementById('dailyCount');
  if(dEl) dEl.textContent = dailyCount >= DAILY_GOAL ? `${DAILY_GOAL}+ ✓` : dailyCount;
  const sEl = document.getElementById('streakCount');

/* =========================================================
   SPACED REPETITION for missed words — expanding intervals
   (measured in "questions answered", not days, so it works within
   normal play regardless of session length). Research on the spacing
   effect favors a real gap before the first re-test (immediate massed
   repetition helps less) and growing intervals thereafter (~2.5x each
   step, similar to SM-2/Leitner-style schedulers); a wrong answer at
   any point resets back to the shortest interval.
========================================================= */
const SRS_INTERVALS = [12, 30, 75]; // "due again after N more questions answered"
let totalAnswered = 0;
let srsSchedule = {}; // en -> { stage, dueAt }

function scheduleSRSReview(en){
  srsSchedule[en] = { stage: 0, dueAt: totalAnswered + SRS_INTERVALS[0] };
  saveProgress();
}
function advanceSRSReview(en){
  const existing = srsSchedule[en];
  if(!existing) return; // this word wasn't under active spaced review
  const nextStage = existing.stage + 1;
  if(nextStage >= SRS_INTERVALS.length){
    delete srsSchedule[en]; // graduated — reinforced enough times to drop it
  } else {
    srsSchedule[en] = { stage: nextStage, dueAt: totalAnswered + SRS_INTERVALS[nextStage] };
  }
  saveProgress();
}
function getDueSRSItem(){
  for(const en in srsSchedule){
    if(srsSchedule[en].dueAt <= totalAnswered){
      const v = VOCAB.find(x=>x.en===en);
      if(v) return v;
    }
  }
  return null;
}

async function saveProgress(){
  try{
    await window.storage.set('neko_progress', JSON.stringify({
      mastered: Array.from(masteredWords),
      mistakes: mistakeCounts,
      coins,
      ownedCats: Array.from(ownedCats),
      dailyCount, lastPlayDate, lastGoalDate, streak,
      totalAnswered, srsSchedule,
    }), false);
  } catch(e){ /* storage unavailable */ }
}

async function loadProgress(){
  try{
    const res = await window.storage.get('neko_progress');
    if(res && res.value){
      const data = JSON.parse(res.value);
      masteredWords = new Set(data.mastered || []);
      mistakeCounts = data.mistakes || {};
      coins = data.coins || 0;
      ownedCats = new Set(data.ownedCats || []);
      dailyCount = data.dailyCount || 0;
      lastPlayDate = data.lastPlayDate || null;
      lastGoalDate = data.lastGoalDate || null;
      streak = data.streak || 0;
      totalAnswered = data.totalAnswered || 0;
      srsSchedule = data.srsSchedule || {};
      wordCountEl.textContent = masteredWords.size;
      rebuildJarOrbs();
      refreshMistakeBadge();
      updateCoinHUD();
      checkDailyRollover();
      updateDailyHUD();
      lastKnownLevel = getLevel();
      updateLevelHUD();
    }
  } catch(e){ /* first time playing, nothing saved yet */ }
}

  jarOrbs.innerHTML = '';

let currentIslandId = 'meadow';

// unlockAt is a mastered-word-count threshold (not a level number), so it
// stays stable even if WORDS_PER_LEVEL is tuned later.
function unlockStatusFor(island){
  if(island.status === 'comingSoon') return 'comingSoon';
  return masteredWords.size >= island.unlockAt ? 'unlocked' : 'locked';
}

function travelToIsland(id){
  const island = ISLANDS.find(i=>i.id===id);
  if(!island || unlockStatusFor(island) !== 'unlocked') return;
  currentIslandId = id;
  const theme = island.theme;

  // recolor path
  pathSegments.forEach(seg => seg.material.color.set(theme.path));

  // recolor + rescale buildings
  buildingGroups.forEach((b,i)=>{
    b.userData.wall.material.color.set(theme.wall);
    b.userData.roof.material.color.set(theme.roofs[i % theme.roofs.length]);
    b.userData.wall.scale.y = theme.buildingScaleY;
    b.userData.wall.position.y = 1.2 * theme.buildingScaleY;
    b.userData.roof.position.y = 2.4*theme.buildingScaleY + 0.85;
  });

  // show/hide trees & co.
  natureGroup.visible = theme.natureVisible;

  // move NPCs & landmarks to this island's layout
  npcs.forEach(n=>{
    const pos = island.npcPos[n.def.id];
    if(pos){ n.mesh.position.set(pos[0],0,pos[1]); n.def.pos=[pos[0],0,pos[1]]; }
  });
  landmarks.forEach(l=>{
    const pos = island.landmarkPos[l.id];
    if(pos){ l.group.position.set(pos[0],0,pos[1]); }
  });

  // send the player back to the spawn point and snap the camera there
  player.position.set(0,0,4);
  playerFacing = 0;
  player.rotation.y = 0;
  camera.position.set(0,2.6,4-6.8);
  camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1.1,0)));

  applyDayNight();
  updateIslandUI();
}

function updateIslandUI(){
  const badge = document.getElementById('islandBadge');

  if(badge) badge.textContent = `${island.emoji} ${island.name}`;
}

function renderIslandList(){
  const listEl = document.getElementById('islandList');
  listEl.innerHTML = ISLANDS.map(island=>{
    const status = unlockStatusFor(island);
    const isCurrent = island.id === currentIslandId;
    let statusText;
    if(status === 'comingSoon') statusText = '🔒 じゅんびちゅう';
    else if(status === 'locked') statusText = `🔒 ことばを ${island.unlockAt}こ 覚えると 行けるよ（いま ${masteredWords.size}こ）`;
    else statusText = isCurrent ? '📍 いまここ' : 'タップして行く →';
    return `<div class="island-card ${isCurrent?'current':''} ${status!=='unlocked'?status:''}" data-id="${island.id}">
      <span class="island-emoji">${island.emoji}</span>
      <div>
        <div class="island-name">${island.name}</div>
        <div class="island-status">${statusText}</div>
      </div>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.island-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const island = ISLANDS.find(i=>i.id===card.dataset.id);
      if(unlockStatusFor(island) !== 'unlocked' || island.id === currentIslandId) return;
      travelToIsland(island.id);
      islandOverlay.classList.remove('show');
    });
  });
}

/* =========================================================
   MINIMAP (2D top-down view of the island, bottom-right corner)
========================================================= */
const minimapCanvas = document.getElementById('minimapCanvas');
const mmCtx = minimapCanvas.getContext('2d');
const WORLD_RADIUS = 34;
const BUILDING_SPOTS = [[-9,-9],[8,-2],[2,-16]];
const POND_SPOT = [-3,9];
const MM_SCALE = 58 / WORLD_RADIUS;

function worldToMap(x,z){
  return [75 + x*MM_SCALE, 75 + z*MM_SCALE];
}

function drawMinimap(){
  mmCtx.clearRect(0,0,150,150);

  mmCtx.beginPath();
  mmCtx.arc(75,75,62,0,Math.PI*2);
  mmCtx.fillStyle = '#BFEFDD';
  mmCtx.fill();

  const [px,pz] = worldToMap(POND_SPOT[0], POND_SPOT[1]);
  mmCtx.beginPath();
  mmCtx.arc(px,pz,7,0,Math.PI*2);
  mmCtx.fillStyle = '#8FC7FF';
  mmCtx.fill();

  mmCtx.fillStyle = '#FFB3C1';
  BUILDING_SPOTS.forEach(([x,z])=>{
    const [mx,mz] = worldToMap(x,z);
    mmCtx.fillRect(mx-4, mz-4, 8, 8);
  });

  npcs.forEach(n=>{
    const [mx,mz] = worldToMap(n.mesh.position.x, n.mesh.position.z);
    mmCtx.beginPath();
    mmCtx.arc(mx,mz,4,0,Math.PI*2);
    mmCtx.fillStyle = '#' + n.def.color.toString(16).padStart(6,'0');
    mmCtx.fill();
  });

  landmarks.forEach(l=>{
    const [mx,mz] = worldToMap(l.group.position.x, l.group.position.z);
    mmCtx.font = '10px sans-serif';
    mmCtx.textAlign = 'center';
    mmCtx.textBaseline = 'middle';
    mmCtx.fillText(l.emoji, mx, mz);
  });

  const [ppx,ppz] = worldToMap(player.position.x, player.position.z);
  mmCtx.save();
  mmCtx.translate(ppx,ppz);
  mmCtx.rotate(-playerFacing);
  mmCtx.beginPath();
  mmCtx.moveTo(0,7);
  mmCtx.lineTo(-5,-5);
  mmCtx.lineTo(5,-5);
  mmCtx.closePath();
  mmCtx.fillStyle = '#F06A82';
  mmCtx.fill();
  mmCtx.restore();
}

/* =========================================================
   CHARACTER BUILDER (chibi rig: big head, small round body, shared by
   the player and every NPC — cat / bear / owl / rabbit variants)
========================================================= */
function makeCharacter({ bodyColor, earColor, earType }){
  const g = new THREE.Group();

  const toon = (c)=> new THREE.MeshToonMaterial({ color:c });
  const lighten = (hex, amt)=>{
    const r = Math.min(255, ((hex>>16)&255) + amt);
    const gr = Math.min(255, ((hex>>8)&255) + amt);
    const b = Math.min(255, (hex&255) + amt);
    return (r<<16)|(gr<<8)|b;
  };
  const bellyColor = lighten(bodyColor, 55);

  // small round sitting body
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5,20,16), toon(bodyColor));
  body.scale.set(1.05, 0.8, 1);
  body.position.y = 0.46;
  g.add(body);

  // cream belly patch
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12), toon(bellyColor));
  belly.scale.set(0.9,0.75,0.55);
  belly.position.set(0, 0.42, 0.32);
  g.add(belly);

  // paws (front, sitting pose)
  [-1,1].forEach(side=>{
    const paw = new THREE.Mesh(new THREE.SphereGeometry(0.14,12,10), toon(bodyColor));
    paw.position.set(side*0.24, 0.16, 0.42);
    g.add(paw);
  });

  // big chibi head (bigger than the body = cuter proportions)
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.66,22,18), toon(bodyColor));
  head.position.y = 1.28;
  g.add(head);

  // muzzle bump
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.26,16,12), toon(bellyColor));
  muzzle.scale.set(1,0.72,0.85);
  muzzle.position.set(0, 1.14, 0.52);
  g.add(muzzle);

  // ears vary by type
  if(earType === 'rabbit'){
    [-1,1].forEach(side=>{
      const earGeo = (typeof THREE.CapsuleGeometry === 'function')
        ? new THREE.CapsuleGeometry(0.13,0.5,4,8)
        : new THREE.CylinderGeometry(0.14,0.14,0.7,8);
      const ear = new THREE.Mesh(earGeo, toon(bodyColor));
      ear.position.set(side*0.26, 2.05, -0.02);
      ear.rotation.z = side*0.24;
      const earInner = new THREE.Mesh(new THREE.SphereGeometry(0.09,10,10), toon(earColor));
      earInner.position.set(side*0.26 + side*0.13, 2.35, 0.06);
      g.add(ear, earInner);
    });
  } else if(earType === 'cat'){
    [-1,1].forEach(side=>{
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.19,0.36,8), toon(bodyColor));
      ear.scale.set(1,1,0.45); // flatten front-to-back so it reads as a flat triangle
      ear.position.set(side*0.44, 1.98, -0.02);
      ear.rotation.z = side*0.34;  // tilt outward, like alert cat ears
      ear.rotation.x = -0.12;      // tilt slightly forward
      const earInner = new THREE.Mesh(new THREE.ConeGeometry(0.1,0.22,8), toon(earColor));
      earInner.scale.set(1,1,0.45);
      earInner.position.set(side*0.42, 1.95, 0.08);
      earInner.rotation.z = side*0.34;
      earInner.rotation.x = -0.12;
      g.add(ear, earInner);
    });
    // pink nose
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.05,0.07,6), toon(0xFF8FA3));
    nose.rotation.x = Math.PI/2;
    nose.position.set(0, 1.22, 0.76);
    g.add(nose);
    // whiskers
    [-1,1].forEach(side=>{
      for(let i=0;i<3;i++){
        const whisker = new THREE.Mesh(
          new THREE.CylinderGeometry(0.008,0.008,0.38,4),
          new THREE.MeshBasicMaterial({color:0xFFFFFF})
        );
        whisker.rotation.z = Math.PI/2 + side*0.15 + i*side*0.12;
        whisker.position.set(side*0.36, 1.16 - i*0.045, 0.64);
        g.add(whisker);
      }
    });
    // tail: a few segments curving up and back
    const tailMat = toon(bodyColor);
    const seg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,0.56,8), tailMat);
    seg1.position.set(0, 0.6, -0.54);
    seg1.rotation.x = -1.15;
    const seg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.09,0.46,8), tailMat);
    seg2.position.set(0, 1.0, -0.82);
    seg2.rotation.x = -0.3;
    const tailTip = new THREE.Mesh(new THREE.SphereGeometry(0.08,10,10), toon(earColor));
    tailTip.position.set(0, 1.22, -0.66);
    g.add(seg1, seg2, tailTip);
  } else if(earType === 'bear'){
    [-1,1].forEach(side=>{
      const ear = new THREE.Mesh(new THREE.SphereGeometry(0.2,14,12), toon(bodyColor));
      ear.position.set(side*0.44, 1.8, -0.02);
      g.add(ear);
      const earInner = new THREE.Mesh(new THREE.SphereGeometry(0.11,10,10), toon(earColor));
      earInner.position.set(side*0.44, 1.8, 0.1);
      g.add(earInner);
    });
  } else if(earType === 'owl'){
    [-1,1].forEach(side=>{
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.13,0.2,4), toon(bodyColor));
      ear.position.set(side*0.26, 1.9, -0.05);
      g.add(ear);
    });
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.11,0.22,6), toon(0xFFD873));
    beak.rotation.x = Math.PI/2;
    beak.position.set(0, 1.18, 0.62);
    g.add(beak);
  }

  // cheeks
  [-1,1].forEach(side=>{
    const cheek = new THREE.Mesh(new THREE.CircleGeometry(0.1,12), new THREE.MeshBasicMaterial({color:0xFFB3C1}));
    cheek.position.set(side*0.4, 1.15, 0.56);
    cheek.rotation.y = side*-0.5;
    g.add(cheek);
  });

  // big sparkly eyes
  const eyeGeo = new THREE.SphereGeometry(0.1,14,12);
  const eyeMat = new THREE.MeshBasicMaterial({color:0x4A3B5C});
  const sparkGeo = new THREE.SphereGeometry(0.035,8,8);
  const sparkMat = new THREE.MeshBasicMaterial({color:0xFFFFFF});
  [-1,1].forEach(side=>{
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(side*0.24, 1.32, 0.58);
    g.add(eye);
    const spark = new THREE.Mesh(sparkGeo, sparkMat);
    spark.position.set(side*0.24 + 0.035, 1.36, 0.65);
    g.add(spark);
  });

  const shadow = makeBlobShadow(0.55);
  g.add(shadow);

  g.userData.head = head;
  g.userData.body = body;
  return g;
}

// pick a free-ish spot for a newly created custom NPC
function findSpawnSpot(){
  for(let tries=0; tries<30; tries++){
    const a = Math.random()*Math.PI*2, r = 6 + Math.random()*20;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const tooClose = npcs.some(n => Math.hypot(n.def.pos[0]-x, n.def.pos[2]-z) < 4);
    if(!tooClose) return [x,z];
  }
  return [Math.random()*10-5, Math.random()*10-5];
}

/* =========================================================
   CONTROLS: floating touch joystick (appears wherever you touch,
   instead of a fixed widget in the corner)
========================================================= */
const joyBase = document.getElementById('joyBase');
const joyStick = document.getElementById('joyStick');
const JOY_RADIUS = 55; // px — how far the stick can travel from the touch point
let joyVec = {x:0,y:0};
let joyActive = false;
let joyPointerId = null;
let joyOriginX = 0, joyOriginY = 0;
let joyReferenceYaw = 0; // captured once per touch — see movement code for why

function joyReset(){
  joyVec = {x:0,y:0};
  joyBase.classList.remove('show');
  joyStick.style.transform = 'translate(-50%,-50%)';
}

function isTouchOnUI(target){
  // don't hijack touches that land on real UI controls (buttons, overlays, etc.)
  return !!target.closest('button, .quiz-card, .npc-create-card, #minimapWrap, #minimapCanvas, a, input, textarea');
}

canvas.addEventListener('pointerdown', e=>{
  if(joyActive) return;
  if(isTouchOnUI(e.target)) return;
  joyActive = true;
  joyPointerId = e.pointerId;
  joyOriginX = e.clientX;
  joyOriginY = e.clientY;
  joyReferenceYaw = playerFacing; // lock in "forward" for this whole touch
  joyBase.style.left = joyOriginX + 'px';
  joyBase.style.top = joyOriginY + 'px';
  joyBase.classList.add('show');
  canvas.setPointerCapture(e.pointerId);
  updateJoy(e);
});
canvas.addEventListener('pointermove', e=>{
  if(joyActive && e.pointerId === joyPointerId) updateJoy(e);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  canvas.addEventListener(ev, e=>{
    if(e.pointerId === joyPointerId){ joyActive=false; joyReset(); }
  });
});
function updateJoy(e){
  let dx = e.clientX - joyOriginX, dy = e.clientY - joyOriginY;
  const dist = Math.min(Math.hypot(dx,dy), JOY_RADIUS);
  const ang = Math.atan2(dy,dx);
  dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
  joyStick.style.transform = `translate(${dx-24}px, ${dy-24}px)`;
  joyVec.x = dx / JOY_RADIUS;
  joyVec.y = dy / JOY_RADIUS;
}

/* =========================================================
   SOUND EFFECTS (procedural, via Web Audio API — no asset files needed)
========================================================= */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// unlock audio on the very first touch anywhere on the page. iOS Safari
// can require more than just creating/resuming the context — actually
// starting a (silent) node within the gesture is the more reliable way
// to fully unlock playback.
document.addEventListener('pointerdown', unlockAudio, { once:true, capture:true });
function unlockAudio(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  g.gain.value = 0.0001;
  osc.connect(g).connect(ctx.destination);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.01);
}

function playTone(freq, duration, startTime, gain, type){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + (startTime||0);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function playCorrectSound(){
  playTone(523.25, 0.14, 0,    0.16, 'sine'); // C5
  playTone(659.25, 0.14, 0.08, 0.16, 'sine'); // E5
  playTone(783.99, 0.22, 0.16, 0.18, 'sine'); // G5
}
function playWrongSound(){
  playTone(330, 0.16, 0,    0.11, 'sine');
  playTone(233, 0.24, 0.09, 0.11, 'sine');
}
function playFootstepSound(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  const base = 520 + Math.random()*90;
  osc.type = 'sine';
  const t0 = ctx.currentTime;
  osc.frequency.setValueAtTime(base, t0);
  osc.frequency.exponentialRampToValueAtTime(base*0.5, t0+0.07);
  g.gain.setValueAtTime(0.001, t0);
  g.gain.exponentialRampToValueAtTime(0.22, t0+0.008); // quick percussive attack
  g.gain.exponentialRampToValueAtTime(0.001, t0+0.11);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0+0.12);
}

const clock = new THREE.Clock();
let footstepTimer = 0;
let playerFacing = 0;
const INTERACT_DIST = 2.6;
let nearNPC = null;
let nearLandmark = null;
const interactBtn = document.getElementById('interactBtn');
const hintPill = document.getElementById('hintPill');
setTimeout(()=> hintPill.classList.add('hide'), 4500);

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // movement — joystick input is interpreted relative to joyReferenceYaw,
  // which is captured once when the touch begins (see pointerdown above)
  // and held fixed for the whole drag. Using anything that updates every
  // frame (playerFacing, or even the camera's lagging orientation) as the
  // reference creates a feedback loop: the target angle keeps leading
  // whatever it's derived from, so facing chases a target that keeps
  // moving with it — runaway spin on any non-perfectly-vertical stick
  // input. A per-touch-constant reference has no such loop.
  const mag = Math.hypot(joyVec.x, joyVec.y);
  if(mag > 0.08 && !quizOpen){
    const localRight = joyVec.x;
    const localForward = -joyVec.y; // screen-up (negative dy) = forward
    const worldDX = localForward*Math.sin(joyReferenceYaw) + localRight*Math.cos(joyReferenceYaw);
    const worldDZ = localForward*Math.cos(joyReferenceYaw) - localRight*Math.sin(joyReferenceYaw);
    const targetAngle = Math.atan2(worldDX, worldDZ);
    let diff = targetAngle - playerFacing;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    playerFacing += diff * Math.min(1, dt*3.2);
    const speed = 2.8 * Math.min(mag,1);
    player.position.x += Math.sin(playerFacing) * speed * dt;
    player.position.z += Math.cos(playerFacing) * speed * dt;
    // clamp to ground circle
    const d = Math.hypot(player.position.x, player.position.z);
    if(d > 32){
      const s = 32/d;
      player.position.x *= s; player.position.z *= s;
    }
    player.rotation.y = playerFacing;
    player.position.y = Math.abs(Math.sin(t*9))*0.06;

    footstepTimer += dt;
    if(footstepTimer > 0.32){
      footstepTimer = 0;
      playFootstepSound();
    }
  } else {
    player.position.y = Math.abs(Math.sin(t*2.4))*0.02;
    footstepTimer = 0.32; // next step plays right away when movement resumes
  }

  // butterflies drifting in lazy loops
  butterflies.forEach(b=>{
    b.spr.position.x = b.baseX + Math.sin(t*0.6 + b.phase)*1.1;
    b.spr.position.z = b.baseZ + Math.cos(t*0.5 + b.phase)*1.1;
    b.spr.position.y = 1.2 + Math.sin(t*2.2 + b.phase)*0.15;
  });

  // npc idle bob + nearest check (NPCs and special landmarks share the interact button)
  let closest = null, closestDist = Infinity, closestKind = null;
  npcs.forEach(n=>{
    n.mesh.position.y = Math.abs(Math.sin(t*1.8 + n.def.pos[0]))*0.05;
    n.marker.position.y = 2.5 + Math.sin(t*3 + n.def.pos[0])*0.08;
    n.marker.visible = !allMastered(n);
    const dist = player.position.distanceTo(n.mesh.position);
    if(dist < closestDist){ closestDist = dist; closest = n; closestKind = 'npc'; }
  });
  landmarks.forEach(l=>{
    l.marker.position.y = 2.15 + Math.sin(t*2.5 + l.group.position.x)*0.1;
    if(l.ball) l.ball.rotation.y = t*0.6;
    if(l.star) l.star.rotation.y = t*0.8;
    const dist = player.position.distanceTo(l.group.position);
    if(dist < closestDist){ closestDist = dist; closest = l; closestKind = 'landmark'; }
  });
  if(closest && closestDist < INTERACT_DIST){
    nearNPC = closestKind === 'npc' ? closest : null;
    nearLandmark = closestKind === 'landmark' ? closest : null;
    interactBtn.textContent = closestKind === 'npc' ? '💬 はなしかける' : closest.label;
    interactBtn.classList.add('show');
  } else {
    nearNPC = null;
    nearLandmark = null;
    interactBtn.classList.remove('show');
  }

  // camera follow (third person, behind player)
  const camOffset = new THREE.Vector3(
    Math.sin(playerFacing) * -6.8,
    2.6,
    Math.cos(playerFacing) * -6.8
  );
  const desiredCamPos = player.position.clone().add(camOffset);
  camera.position.lerp(desiredCamPos, 1 - Math.pow(0.001, dt));
  const lookTarget = player.position.clone().add(new THREE.Vector3(0,1.1,0));
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  drawMinimap();
}
animate();

function renderCatAlbum(){
  const albumEl = document.getElementById('catAlbum');
  const list = CAT_BREEDS.filter(c => catAlbumFilter==='all' || c.rarity===catAlbumFilter);
  albumEl.innerHTML = list.map(c=>{
    const owned = ownedCats.has(c.id);
    const canAfford = coins >= c.cost;
    return `<div class="cat-card ${owned?'owned':''}">
      <span class="rarity-pill ${c.rarity}">${RARITY_LABEL[c.rarity]}</span>
      <span class="name">🐱 ${c.name}</span>
      ${owned
        ? `<span class="owned-label">✓ 図鑑にある</span>`
        : `<button class="acquire-btn" data-id="${c.id}" ${canAfford?'':'disabled'}>${canAfford ? `てにいれる（${c.cost}🪙）` : `${c.cost}🪙 ひつよう`}</button>`
      }
    </div>`;
  }).join('');

  albumEl.querySelectorAll('.acquire-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const breed = CAT_BREEDS.find(c=>c.id===btn.dataset.id);
      if(!breed || coins < breed.cost) return;
      coins -= breed.cost;
      ownedCats.add(breed.id);

      setTimeout(()=> note.remove(), 2200);
    });

// Generates a brand-new example sentence for a word the learner has already
// mastered from this NPC, so the practice keeps adapting instead of repeating
// the same fixed sentence forever. Uses the in-artifact Claude API call.
async function generateAIExercise(npc){
  const masteredInCat = npc.vocabList.filter(v=>masteredWords.has(v.en));
  if(masteredInCat.length===0) return null;
  const target = masteredInCat[Math.floor(Math.random()*masteredInCat.length)];

  const level = masteredWords.size;
  const difficultyHint = level < 6
    ? 'とても短く簡単な文構造'
    : level < 12
    ? '英検準2級レベルの標準的な文'
    : '英検準2級の範囲内で、少し複雑な文でもよい';

  const prompt = `あなたは日本の小学校高学年の女の子向け英語学習ゲームに出てくる、キャラクターです。
あなたのキャラクター設定：
- 名前: ${npc.def.name}
- 性格: ${npc.def.personality || 'げんき'}
- プロフィール: ${npc.def.bio || '（とくになし）'}
このキャラクターの口調・性格が伝わるように、英検準2級レベルの単語・熟語「${target.en}」（日本語の意味: ${target.ja}）を使った、短い2〜3ターンの自然な会話を1つ新しく作ってください。
条件：
- ${difficultyHint}にすること
- まずキャラが何か話しかける一文（opener）を作る
- それに対する返事として、指定の単語・熟語を使った一文（sentence）を作る。単語や熟語の形は変えないこと（活用や語順を変えない）
- 最後にキャラが返す短いリアクション（reaction）を1文作る。ここにキャラクターの性格を反映させること
- 日本語訳（openerJa, reactionJa）の文末表現にも、そのキャラクターの性格・口調を反映させること
- 前に使った例文「${target.sentence}」とは違う場面・文脈にすること
出力は次のJSON形式だけを返し、説明文やコードブロック記号（\`\`\`）は絶対に付けないでください：
{"opener":"英文","openerJa":"その日本語訳","sentence":"英文","sentenceJa":"その日本語訳","reaction":"英文","reactionJa":"その日本語訳"}`;

  try{
    const data = await callClaudeProxy(prompt);
    const text = (data.content || []).map(b=>b.text||'').join('').trim();
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(!parsed.sentence || !parsed.sentenceJa) return null;
    return {
      en: target.en, ja: target.ja, cat: target.cat,
      opener: parsed.opener || '', openerJa: parsed.openerJa || '',
      sentence: parsed.sentence, sentenceJa: parsed.sentenceJa,
      reaction: parsed.reaction || '', reactionJa: parsed.reactionJa || ''
    };
  } catch(e){
    return null;
  }
}

  quizCard.classList.remove('flash-good','flash-bad');
  nextBtn.classList.remove('show');
  nextBtn.textContent = 'つぎへ →';

  if(quizIndex >= activeQueue.length){
    npcSub.textContent = 'ありがとう！';
    quizBody.innerHTML = `<div class="npc-done-panel">
      <div class="emoji">🎉</div>
      <p>今日はよくがんばったね！</p>
    </div>`;
    nextBtn.textContent = 'とじる';
    nextBtn.classList.add('show');
    nextBtn.onclick = closeQuiz;
    return;
  }

  const item = activeQueue[quizIndex];
  const myRequestId = ++loadQuestionRequestId;
  await ensureExerciseContent(item);
  if(myRequestId !== loadQuestionRequestId) return; // a newer question started while we were waiting

  const mode = quizIndex % 2 === 0 ? 'blank' : 'order';
  mode === 'blank' ? renderBlankExercise(item) : renderOrderExercise(item);

  nextBtn.onclick = ()=>{ quizIndex++; loadQuestion(); };

  // quietly start generating the next couple of upcoming words in the
  // background, so by the time the player gets there, the wait is gone
  prefetchUpcoming();
}
let loadQuestionRequestId = 0;

function prefetchUpcoming(){
  const upcoming = activeQueue.slice(quizIndex+1, quizIndex+3);
  upcoming.forEach(item => { generateAndCache(item); }); // fire and forget
}

/* ---------- generate example sentences on demand for imported words ---------- */
let sentenceCache = {}; // en -> {sentence, sentenceJa, opener, openerJa, reaction, reactionJa}
const pendingGenerations = new Map(); // en -> in-flight Promise, avoids duplicate requests

async function loadSentenceCache(){
  try{
    const res = await window.storage.get('neko_sentence_cache');
    if(res && res.value) sentenceCache = JSON.parse(res.value);
  } catch(e){ /* none yet */ }
}
async function saveSentenceCache(){
  try{ await window.storage.set('neko_sentence_cache', JSON.stringify(sentenceCache), false); }
  catch(e){ /* storage unavailable */ }
}

function applyGeneratedContent(item, data){
  item.sentence = data.sentence;
  item.sentenceJa = data.sentenceJa;
  item.opener = data.opener || '';
  item.openerJa = data.openerJa || '';
  item.reaction = data.reaction || '';
  item.reactionJa = data.reactionJa || '';
}

function fallbackContent(item){
  return {
    sentence: `I want to learn the word "${item.en}".`,
    sentenceJa: `わたしは「${item.ja}」ということばを覚えたいです。`,
    opener: '', openerJa: '', reaction: '', reactionJa: '',
  };
}

// generates (or reuses a cached / in-flight) result for one word, with no
// UI side effects — safe to call for background prefetching
async function generateAndCache(item){
  if(item.sentence) return;
  if(sentenceCache[item.en]){
    applyGeneratedContent(item, sentenceCache[item.en]);
    return;
  }
  if(pendingGenerations.has(item.en)){
    await pendingGenerations.get(item.en);
    return;
  }
  const p = (async ()=>{
    const generated = await generateSentenceForWord(item);
    const data = generated || fallbackContent(item);
    applyGeneratedContent(item, data);
    sentenceCache[item.en] = data;
    saveSentenceCache();
  })();
  pendingGenerations.set(item.en, p);
  try{ await p; }
  finally{ pendingGenerations.delete(item.en); }
}

const THINKING_MESSAGES = ['ことばを考え中', 'もうすこしまってね', 'いい文章をさがし中'];

async function ensureExerciseContent(item){
  if(item.sentence) return; // curated word, or already generated/prefetched
  if(sentenceCache[item.en]){
    applyGeneratedContent(item, sentenceCache[item.en]);
    return;
  }

  const msg = THINKING_MESSAGES[Math.floor(Math.random()*THINKING_MESSAGES.length)];
  quizBody.innerHTML = `<div class="npc-done-panel">
    <div class="emoji thinking-emoji">💭</div>
    <p>${msg}<span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span></p>
  </div>`;
  nextBtn.classList.remove('show');

  await generateAndCache(item);
}

async function generateSentenceForWord(item){
  const personality = activeNPC ? (activeNPC.def.personality || 'げんき') : 'げんき';
  const prompt = `あなたは日本の小学校高学年の女の子向け英語学習ゲームに出てくるキャラクター（性格: ${personality}）です。
英検準2級レベルの単語・熟語「${item.en}」（日本語の意味: ${item.ja}）を使った、短い2〜3ターンの自然な会話を1つ作ってください。
条件：
- 中学生にもわかる、やさしい英文にすること
- まずキャラが何か話しかける一文（opener）を作る
- それに対する返事として、指定の単語・熟語を使った一文（sentence）を作る。単語や熟語の形は変えないこと（活用や語順を変えない）
- 最後にキャラが返す短いリアクション（reaction）を1文作る
出力は次のJSON形式だけを返し、説明文やコードブロック記号（\`\`\`）は絶対に付けないでください：
{"opener":"英文","openerJa":"その日本語訳","sentence":"英文","sentenceJa":"その日本語訳","reaction":"英文","reactionJa":"その日本語訳"}`;

  try{
    const data = await callClaudeProxy(prompt);
    const text = (data.content || []).map(b=>b.text||'').join('').trim();
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(!parsed.sentence || !parsed.sentenceJa) return null;
    return parsed;
  } catch(e){
    return null;
  }
}

/* ---------- exercise 1: fill the blank in the NPC's sentence ---------- */
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function insertBlank(sentence, target){
  const re = new RegExp(escapeRegex(target), 'i'); // case-insensitive, matches AI-generated text too
  if(re.test(sentence)){
    return sentence.replace(re, '<span class="blank-slot" id="blankSlot">___</span>');
  }
  // fallback: target word form wasn't found verbatim (e.g. AI inflected it) —
  // still show a usable blank rather than breaking the exercise
  return sentence + ' <span class="blank-slot" id="blankSlot">___</span>';
}

function renderBlankExercise(item){
  quizBody.innerHTML = `
    <div class="dialogue-bubble"><span class="en">${item.opener || ''}</span><span class="ja">${item.openerJa || ''}</span></div>
    <span class="reply-label">きみの返事 ▼</span>
    <div class="sentence-line" id="sentenceLine"></div>
    <div class="ja-hint">${item.sentenceJa}</div>
    <div class="choices" id="choices"></div>
    <div id="feedbackSlot"></div>
    <div id="reactionSlot"></div>
  `;
  const blankHtml = insertBlank(item.sentence, item.en);
  document.getElementById('sentenceLine').innerHTML = blankHtml;

  const distractors = shuffle(VOCAB.filter(v=>v.en!==item.en)).slice(0,3);
  const options = shuffle([item, ...distractors]);
  const cw = document.getElementById('choices');
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className='choice-btn';
    btn.textContent = opt.en;
    btn.dataset.correct = opt.en===item.en ? '1':'0';
    btn.onclick = ()=> handleBlankAnswer(btn, opt.en===item.en, item);
    cw.appendChild(btn);
  });
}

function handleBlankAnswer(btn, correct, item){
  totalAnswered++;
  const btns = document.querySelectorAll('#choices .choice-btn');
  btns.forEach(b=> b.classList.add('disabled'));
  const slot = document.getElementById('blankSlot');
  if(slot) slot.textContent = item.en;

  if(correct){
    btn.classList.add('correct');
    if(slot) slot.classList.add('filled-correct');
    quizCard.classList.add('flash-good');
    markMastered(item);
    recordDailyProgress();
    burstSparkles(btn);
    playCorrectSound();
    speakEnglish([item.opener, item.sentence, item.reaction].filter(Boolean).join(' '));
    document.getElementById('feedbackSlot').innerHTML =
      `<div class="feedback-banner correct">✅ Correct! <span class="ja">せいかい！</span></div>`;
    if(item.reaction){
      document.getElementById('reactionSlot').innerHTML =
        `<div class="reaction-bubble"><span class="en">${item.reaction}</span><span class="ja">${item.reactionJa||''}</span></div>`;
    }
    recordMistakeResolved(item.en);
  } else {
    btn.classList.add('wrong');
    if(slot) slot.classList.add('filled-wrong');
    quizCard.classList.add('flash-bad');
    btns.forEach(b=>{ if(b.dataset.correct==='1') b.classList.add('correct'); });
    playWrongSound();
    document.getElementById('feedbackSlot').innerHTML =
      `<div class="feedback-banner wrong">❌ Not quite! <span class="ja">おしい！</span></div>`;
    recordMistake(item.en);
  }
  nextBtn.classList.add('show');
}

/* ---------- exercise 2: build the English sentence (word order / 英作文) ---------- */
function renderOrderExercise(item){
  const tokens = item.sentence.split(' ');
  const pool = shuffle(tokens);

  quizBody.innerHTML = `
    <div class="dialogue-bubble"><span class="en">${item.opener || ''}</span><span class="ja">${item.openerJa || ''}</span></div>
    <span class="reply-label">きみの返事 ▼</span>
    <div class="ja-hint">${item.sentenceJa}</div>
    <div class="build-line" id="buildLine"></div>
    <div class="chip-pool" id="chipPool"></div>
    <button class="speak-btn" id="speakBtn" aria-label="お手本を聞く" style="align-self:center;">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div id="feedbackSlot"></div>
    <div id="reactionSlot"></div>
  `;
  document.getElementById('speakBtn').onclick = ()=> speakEnglish(item.sentence);

  const buildLine = document.getElementById('buildLine');
  const chipPool = document.getElementById('chipPool');
  let built = [];

  function renderChips(){
    chipPool.innerHTML = '';
    pool.forEach((word, idx)=>{
      if(built.includes(idx)) return;
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = word;
      chip.onclick = ()=>{
        built.push(idx);
        renderChips();
        renderBuild();
        if(built.length === tokens.length) checkOrder();
      };
      chipPool.appendChild(chip);
    });
  }

  function renderBuild(){
    buildLine.innerHTML = '';
    built.forEach((idx)=>{
      const chip = document.createElement('button');
      chip.className = 'build-chip';
      chip.textContent = pool[idx];
      chip.onclick = ()=>{
        if(nextBtn.classList.contains('show')) return; // locked after check
        built = built.filter(i=>i!==idx);
        renderChips();
        renderBuild();
      };
      buildLine.appendChild(chip);
    });
  }

  function checkOrder(){
    totalAnswered++;
    const answer = built.map(idx=>pool[idx]).join(' ');
    const correct = answer === item.sentence;
    const buildChips = buildLine.querySelectorAll('.build-chip');
    buildChips.forEach(c=> c.classList.add('locked'));

    if(correct){
      buildChips.forEach(c=> c.classList.add('correct'));
      quizCard.classList.add('flash-good');
      markMastered(item);
      recordDailyProgress();
      burstSparkles(buildLine);
      playCorrectSound();
      document.getElementById('feedbackSlot').innerHTML =
        `<div class="feedback-banner correct">✅ Correct! <span class="ja">せいかい！</span></div>`;
      if(item.reaction){
        document.getElementById('reactionSlot').innerHTML =
          `<div class="reaction-bubble"><span class="en">${item.reaction}</span><span class="ja">${item.reactionJa||''}</span></div>`;
      }
      recordMistakeResolved(item.en);
      speakEnglish([item.opener, item.sentence, item.reaction].filter(Boolean).join(' '));
    } else {
      buildChips.forEach(c=> c.classList.add('wrong'));
      quizCard.classList.add('flash-bad');
      playWrongSound();
      document.getElementById('feedbackSlot').innerHTML =
        `<div class="feedback-banner wrong">❌ Not quite! <span class="ja">おしい！</span></div>`;
      const ans = document.createElement('div');
      ans.className = 'sentence-answer';
      ans.textContent = 'せいかい: ' + item.sentence;
      quizBody.appendChild(ans);
      recordMistake(item.en);
      speakEnglish(item.sentence);
    }
    nextBtn.classList.add('show');
  }

  renderChips();
}

function markMastered(item){
  if(!masteredWords.has(item.en)){
    masteredWords.add(item.en);
    addOrb(); // awards +3 coins for a brand-new word
  } else {
    addCoins(1); // smaller reward for correctly reviewing an already-known word
  }
  saveProgress();
}

/* ---------- voice selection: use Samantha (US English) on Safari/iOS ---------- */
let preferredVoice = null;
function pickPreferredVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if(!voices.length) return null;
  return voices.find(v => v.name === 'Samantha')
      || voices.find(v => v.name.includes('Samantha'))
      || voices.find(v => v.lang === 'en-US')
      || voices[0];
}
if('speechSynthesis' in window){
  preferredVoice = pickPreferredVoice();
  window.speechSynthesis.onvoiceschanged = ()=>{ preferredVoice = pickPreferredVoice(); };
}

function speakEnglish(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.85;
  if(!preferredVoice) preferredVoice = pickPreferredVoice();
  if(preferredVoice) u.voice = preferredVoice;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

const ORB_POSITIONS = [[24,48],[32,48],[40,48],[22,42],[30,42],[38,42],[42,42],[24,36],[32,36],[40,36],[28,30],[36,30]];
const ORB_COLORS = ['#FF8FA3','#FFD873','#6FE0C2','#B9A6E8'];

function addOrbVisualOnly(index){
  const [cx,cy] = ORB_POSITIONS[index % ORB_POSITIONS.length];
  const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
  circle.setAttribute('cx',cx); circle.setAttribute('cy',cy); circle.setAttribute('r',3.6);
  circle.setAttribute('fill', ORB_COLORS[index % ORB_COLORS.length]);
  jarOrbs.appendChild(circle);
}

function addOrb(){
  wordCountEl.textContent = masteredWords.size;
  addOrbVisualOnly(masteredWords.size - 1);
  addCoins(3);

  const newLevel = getLevel();
  if(newLevel > lastKnownLevel){
    lastKnownLevel = newLevel;
    updateLevelHUD();
    showToast(`⭐ レベルアップ！ Lv.${newLevel} になったよ！`);
  }

  const justUnlocked = ISLANDS.find(i => i.unlockAt === masteredWords.size && i.status !== 'comingSoon');
  if(justUnlocked){
    setTimeout(()=> showToast(`🏝️ あたらしい島「${justUnlocked.name}」に行けるようになったよ！`), 1800);
  }
}

function showToast(text){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:95; background:rgba(74,59,92,0.92); color:#fff; font-weight:800; font-size:13px; padding:12px 20px; border-radius:16px; max-width:80vw; text-align:center; box-shadow:0 10px 28px rgba(0,0,0,0.3);';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 5000);
}

function burstSparkles(btn){
  const rect = btn.getBoundingClientRect();
  const emojis=['✨','⭐','💫'];
  for(let i=0;i<6;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=(rect.left+rect.width/2)+'px';
    s.style.top=(rect.top+rect.height/2)+'px';
    const dx=(Math.random()-0.5)*160, dy=-Math.random()*140-20;
    s.style.setProperty('--dx',dx+'px'); s.style.setProperty('--dy',dy+'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),950);
  }
}

ensurePlayerCode().then(()=>{

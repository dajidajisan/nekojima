function lrDraw(){
  const canvas = document.getElementById('lrCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // platforms
  ctx.fillStyle = '#3A3564';
  LR_ROW_Y.forEach(y=>{
    ctx.fillRect(30, y+18, 740, 10);
  });
  // ladders
  ctx.strokeStyle = '#8993B0';
  ctx.lineWidth = 4;
  LR_LADDER_COLS.forEach(col=>{
    const x = LR_COL_X[col];
    ctx.beginPath();
    ctx.moveTo(x-14, LR_ROW_Y[0]+18);
    ctx.lineTo(x-14, LR_ROW_Y[LR_ROWS-1]+18);
    ctx.moveTo(x+14, LR_ROW_Y[0]+18);
    ctx.lineTo(x+14, LR_ROW_Y[LR_ROWS-1]+18);
    ctx.stroke();
    for(let y=LR_ROW_Y[LR_ROWS-1]+18; y<=LR_ROW_Y[0]+18; y+=18){
      ctx.beginPath(); ctx.moveTo(x-14,y); ctx.lineTo(x+14,y); ctx.stroke();
    }
  });

  // tiles
  if(LR.tiles){
    LR.tiles.forEach(tile=>{
      if(tile.collected) return;
      const node = LR.graph[tile.nodeId];
      const isNext = tile.correctIndex === LR.nextIndex;
      ctx.fillStyle = isNext ? '#FFD873' : '#5E5A88';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(node.x-34, node.y-30, 68, 26, 8) : ctx.rect(node.x-34, node.y-30, 68, 26);
      ctx.fill();
      ctx.fillStyle = isNext ? '#6b4a00' : '#EDEBFA';
      ctx.font = '700 13px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(tile.word, node.x, node.y-17);
    });
  }

  // enemy
  if(LR.enemyPos){
    ctx.font = '34px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🐭', LR.enemyPos.x, LR.enemyPos.y);
  }

  // player
  if(LR.playerPos){
    ctx.save();
    if(LR.invincibleTimer > 0 && Math.floor(LR.invincibleTimer*10)%2===0) ctx.globalAlpha = 0.3;
    ctx.font = '38px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save();
    ctx.translate(LR.playerPos.x, LR.playerPos.y);
    if(LR.playerFacing < 0) ctx.scale(-1,1);
    ctx.fillText('🐱', 0, 0);
    ctx.restore();
    ctx.restore();
  }
}

async function generateSmallTalk(npc){
  const personality = npc.def.personality || 'げんき';
  const likes = npc.def.likes || '';
  const dislikes = npc.def.dislikes || '';
  const prompt = `あなたは日本の小学校高学年の女の子向け英語学習ゲームに出てくるキャラクターです。
あなたのプロフィール：
- 性格: ${personality}
- 好きなもの: ${likes}
- 嫌いなもの: ${dislikes}
英検準2級より簡単な、ごく短い挨拶のやりとり（small talk）を2ターン分作ってください。1ターン目の返事を受けて、2ターン目が自然に続く内容にすること。
条件：
- 1ターン目の opener は "Hi", "Hey", "Hi there" などで始まる、"How are you doing?" や "What's up?" のような軽い挨拶の一文にすること（4語以内）
- 1ターン目の reply は "Good", "Not too bad", "Excellent", "Pretty good" などで始まる、短い返事の一文にすること（6語以内）
- 2ターン目は、1ターン目の続きとして自然なごく短い一往復にすること。できるだけ、あなたの「好きなもの」か「嫌いなもの」のどちらかに軽く触れる内容にすること（例: 好きなものが「ひなたぼっこ」なら「Do you want to sit in the sun?」「Sure, I love that!」のような感じ）
- 単語や熟語のテストではないので、やさしい単語だけを使うこと
- 毎回すこし違う組み合わせ・言い回しにすること
出力は次のJSON形式だけを返し、説明文やコードブロック記号は絶対に付けないでください：
{"turns":[{"opener":"英文","openerJa":"その日本語訳","reply":"英文","replyJa":"その日本語訳"},{"opener":"英文","openerJa":"その日本語訳","reply":"英文","replyJa":"その日本語訳"}]}`;
  try{
    const data = await callClaudeProxy(prompt);
    const text = (data.content || []).map(b=>b.text||'').join('').trim();
    const parsed = extractJSON(text);
    if(!parsed || !Array.isArray(parsed.turns) || parsed.turns.length < 2) return null;
    if(parsed.turns.some(t => !t.opener || !t.reply)) return null;
    return parsed.turns;
  } catch(e){
    return null;
  }
}

function renderSmallTalkTurn(turns, turnIndex, onDone){
  const chat = turns[turnIndex];
  quizBody.innerHTML = `
    <div class="dialogue-bubble"><span class="en">${chat.opener}</span><span class="ja">${chat.openerJa}</span></div>
    <div class="reaction-bubble"><span class="en">${chat.reply}</span><span class="ja">${chat.replyJa}</span></div>
  `;
  speakEnglish(chat.opener + ' ' + chat.reply);
  nextBtn.textContent = 'つぎへ →';
  nextBtn.classList.add('show');
  if(turnIndex + 1 < turns.length){
    nextBtn.onclick = () => renderSmallTalkTurn(turns, turnIndex + 1, onDone);
  } else {
    nextBtn.onclick = onDone;
  }
}

  const dueItem = getDueSRSItem();

  if(queue.length === 0){

  }
  activeQueue = queue;

  renderSmallTalk(npc, loadQuestion);

/* ---------- ローラーコースター: timed command-matching reaction game ---------- */
const COASTER_COMMANDS = [
  { en:"Duck down!", ja:"頭を下げて！", emoji:"🙆" },
  { en:"Raise your hands!", ja:"両手を上げて！", emoji:"🙌" },
  { en:"Hold on tight!", ja:"しっかりつかまって！", emoji:"💪" },
  { en:"Wave your arms!", ja:"腕を振って！", emoji:"👋" },
  { en:"Look up!", ja:"上を見て！", emoji:"👀" },
  { en:"Scream!", ja:"叫んで！", emoji:"😱" },
];
const COASTER_ROUNDS = 6;
const COASTER_TIME_MS = 2800;
let coasterRound = 0;
let coasterScore = 0;
let coasterTimer = null;

function renderCoasterIntro(landmark){
  coasterRound = 0;
  coasterScore = 0;
  if(coasterTimer) clearTimeout(coasterTimer);
  quizBody.innerHTML = `
    <span class="exercise-tag" style="background:#FF6B9D;">🎢 ローラーコースター</span>
    <div class="dialogue-bubble"><span class="en">Ready for the ride? Follow my commands!</span><span class="ja">準備はいい？指示についてきてね！</span></div>
  `;
  speakEnglish("Ready for the ride? Follow my commands!");
  nextBtn.textContent = 'スタート！ 🎢';
  nextBtn.classList.add('show');
  nextBtn.onclick = ()=> renderCoasterRound(landmark);
}

function renderCoasterRound(landmark){
  if(coasterTimer) clearTimeout(coasterTimer);
  if(coasterRound >= COASTER_ROUNDS){ renderCoasterResult(landmark); return; }
  coasterRound++;
  nextBtn.classList.remove('show');

  const correct = COASTER_COMMANDS[Math.floor(Math.random()*COASTER_COMMANDS.length)];
  const distractors = shuffle(COASTER_COMMANDS.filter(c=>c!==correct)).slice(0,3);
  const options = shuffle([correct, ...distractors]);

  quizBody.innerHTML = `
    <span class="exercise-tag" style="background:#FF6B9D;">🎢 ${coasterRound}/${COASTER_ROUNDS}</span>
    <div class="dialogue-bubble"><span class="en">${correct.en}</span><span class="ja">${correct.ja}</span></div>
    <div class="coaster-timerbar"><div class="coaster-timerfill" id="coasterFill"></div></div>
    <div class="choices" id="coasterChoices"></div>
  `;
  speakEnglish(correct.en);

  const fill = document.getElementById('coasterFill');
  requestAnimationFrame(()=>{
    fill.style.transition = `width ${COASTER_TIME_MS}ms linear`;
    fill.style.width = '0%';
  });

  let answered = false;
  const cw = document.getElementById('coasterChoices');
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `${opt.emoji}<br>${opt.en}`;
    btn.onclick = ()=>{
      if(answered) return;
      answered = true;
      clearTimeout(coasterTimer);
      handleCoasterAnswer(opt === correct, landmark);
    };
    cw.appendChild(btn);
  });

  coasterTimer = setTimeout(()=>{
    if(answered) return;
    answered = true;
    handleCoasterAnswer(false, landmark);
  }, COASTER_TIME_MS);
}

function handleCoasterAnswer(correct, landmark){
  if(correct){
    coasterScore++;
    coins += 1;
    updateCoinHUD();
    saveProgress();
    playCorrectSound();
  } else {
    playWrongSound();
  }
  setTimeout(()=> renderCoasterRound(landmark), 450);
}

function renderCoasterResult(landmark){
  if(coasterTimer) clearTimeout(coasterTimer);
  quizBody.innerHTML = `
    <span class="exercise-tag" style="background:#FF6B9D;">🎢 ライド終了！</span>
    <div class="dialogue-bubble"><span class="en">You got ${coasterScore} out of ${COASTER_ROUNDS} right!</span><span class="ja">${COASTER_ROUNDS}問中${coasterScore}問正解！</span></div>
    <div class="feedback-banner correct">🎉 +${coasterScore}🪙</div>
  `;
  speakEnglish(`You got ${coasterScore} out of ${COASTER_ROUNDS} right! Great job!`);
  burstSparkles(document.querySelector('.feedback-banner'));
  nextBtn.textContent = 'もう一回 🎢';
  nextBtn.classList.add('show');
  nextBtn.onclick = ()=> renderCoasterIntro(landmark);
}

async function gradePandaAnswer(japaneseText, userEnglish){
  const prompt = `あなたは日本の小学校高学年の女の子向け英語学習ゲームで、英作文を採点するやさしい先生です。
以下の日本語を、プレイヤーが英語に訳しました。意味が正しく伝わっているか、3段階で採点してください。

日本語の原文: "${japaneseText}"
プレイヤーの英訳: "${userEnglish}"

採点基準：
- 3: 意味が正しく伝わる、自然な英文（多少の文法の細かいミスは許容してよい）
- 2: 意味はだいたい伝わるが、単語や文法にはっきりした間違いがある
- 1: 意味がほとんど伝わらない、または空欄・全く関係ない内容

フィードバックは、小学生が読んでも分かる、やさしく前向きな日本語の一言にすること（間違いがあれば軽く教えてあげる、良ければしっかりほめる）。
出力は次のJSON形式だけを返し、説明文やコードブロック記号は絶対に付けないでください：
{"grade":3,"feedback":"日本語のフィードバック","modelAnswer":"自然な英訳の例"}`;
  try{
    const data = await callClaudeProxy(prompt);
    const text = (data.content || []).map(b=>b.text||'').join('').trim();
    const parsed = extractJSON(text);
    if(!parsed || ![1,2,3].includes(parsed.grade)) return null;
    return parsed;
  } catch(e){
    return null;
  }
}

/* ---------- ねこロボ: rock-paper-scissors minigame ---------- */
const RPS_CHOICES = [
  { key:'rock', emoji:'✊', en:'Rock', ja:'グー' },
  { key:'scissors', emoji:'✌️', en:'Scissors', ja:'チョキ' },
  { key:'paper', emoji:'✋', en:'Paper', ja:'パー' },
];
function rpsWinner(playerKey, robotKey){
  if(playerKey === robotKey) return 'tie';
  const beats = { rock:'scissors', scissors:'paper', paper:'rock' };
  return beats[playerKey] === robotKey ? 'player' : 'robot';
}

function renderCatRobot(landmark){
  quizBody.innerHTML = `
    <span class="exercise-tag" style="background:#9B6BFF;">🤖 ねこロボと じゃんけん</span>
    <div class="dialogue-bubble"><span class="en">Let's play rock-paper-scissors!</span><span class="ja">じゃんけんしよう！</span></div>
    <div class="ja-hint">勝ったらコイン+2、負けたらコイン-2だよ</div>
    <div class="choices" id="rpsChoices"></div>
  `;
  speakEnglish("Let's play rock, paper, scissors!");
  nextBtn.classList.remove('show');
  const cw = document.getElementById('rpsChoices');
  RPS_CHOICES.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `${c.emoji}<br>${c.en}`;
    btn.onclick = ()=> playRPS(c.key, landmark);
    cw.appendChild(btn);
  });
}

function playRPS(playerKey, landmark){
  const robotKey = RPS_CHOICES[Math.floor(Math.random()*3)].key;
  const result = rpsWinner(playerKey, robotKey);
  const playerC = RPS_CHOICES.find(c=>c.key===playerKey);

  quizBody.innerHTML = `
    <span class="exercise-tag" style="background:#9B6BFF;">🤖 ねこロボと じゃんけん</span>
    <div class="dialogue-bubble"><span class="en">I chose ${robotC.en}. You chose ${playerC.en}.</span><span class="ja">ぼくは${robotC.ja}、きみは${playerC.ja}を出したね。</span></div>

{"en":"英文","ja":"その日本語訳","keyWord":"文中の単語・熟語","explain":"その単語の意味・使い方の説明（日本語）"}`;
  try{

// Generates a brand-new example sentence for a word the learner has already
// mastered from this NPC, so the practice keeps adapting instead of repeating
// the same fixed sentence forever. Uses the in-artifact Claude API call.
function extractJSON(text){
  const clean = text.replace(/```json|```/g,'').trim();
  try{ return JSON.parse(clean); } catch(e){}
  // fall back to grabbing the first {...} block, in case the model added
  // any explanatory text around the JSON despite being asked not to
  const match = clean.match(/\{[\s\S]*\}/);
  if(match){
    try{ return JSON.parse(match[0]); } catch(e){}
  }
  return null;
}

async function generateAIExercise(npc){
  const masteredInCat = npc.vocabList.filter(v=>masteredWords.has(v.en));
  if(masteredInCat.length===0) return null;
  const target = masteredInCat[Math.floor(Math.random()*masteredInCat.length)];

  const level = masteredWords.size;
  const difficultyHint = level < 6
    ? 'とても短く簡単な文構造'
    : level < 12
    ? '英検準2級レベルの標準的な文'
    : '英検準2級の範囲内で、少し複雑な文でもよい';

  const prompt = `あなたは日本の小学校高学年の女の子向け英語学習ゲームに出てくる、キャラクターです。
あなたのキャラクター設定：
- 名前: ${npc.def.name}
- 性格: ${npc.def.personality || 'げんき'}
- プロフィール: ${npc.def.bio || '（とくになし）'}
このキャラクターの口調・性格が伝わるように、英検準2級レベルの単語・熟語「${target.en}」（日本語の意味: ${target.ja}）を使った、短い2〜3ターンの自然な会話を1つ新しく作ってください。

【最優先ルール・絶対に守ること】opener が過去形（did, was, wereなどを使った質問、または"last year"や"yesterday"のような過去を表す語を含む文）の場合、sentence の動詞も必ず過去形にすること。sentence の中に "last year"（去年）や "yesterday"（昨日）のような過去を示す語があるのに、動詞だけ現在形のまま、というのは絶対にNGです。
- 悪い例1（NG）: opener「Did you ever wear costumes for school events?」→ sentence「I dress up as a princess last year.」（"last year"があるのに"dress up"が現在形のまま＝NG）
- 良い例1（OK）: 同じopenerなら → sentence「I dressed up as a princess last year.」（過去形"dressed up"＝OK）
- 悪い例2（NG）: opener「Did you learn anything surprising in French class?」→ sentence「I find out that French nouns have genders.」（過去形の質問なのに"find out"が現在形のまま＝NG）
- 良い例2（OK）: 同じopenerなら → sentence「I found out that French nouns have genders.」（過去形"found out"＝OK）
sentence を書き終えたら、必ずこのルールに違反していないか自分で確認してから出力すること。

【最優先ルール・絶対に守ること】「do me a favor」「tell me about it」のように me/you などの代名詞を含む熟語は、話の流れに合わせて自然な代名詞（you, him, her など）に必ず置きかえること。「宿題を手伝って」と頼まれて手伝う側になった場合、"do me a favor"（自分のために）ではなく "do you a favor"（相手のために）が正しいことに注意すること。
- 悪い例（NG）: opener「Can you help with my homework?」→ sentence「Sure, I can do me a favor now.」（手伝う側なのに"me"のまま＝お願いする側とされる側が逆でおかしい＝NG）
- 良い例（OK）: 同じopenerなら → sentence「Sure, I can do you a favor now.」（手伝う相手を正しく"you"にしている＝OK）
sentence を書き終えたら、必ずこのルールに違反していないか自分で確認してから出力すること。

条件：
- ${difficultyHint}にすること
- opener・sentence・reaction は、それぞれ8語以内のごく短い一文にすること（長い文にしないこと。特にsentenceは短いほど良い）
- まずキャラが何か話しかける一文（opener）を作る
- その話しかけに対する返事として、指定の単語・熟語を使った一文（sentence）を作る。文法上必要な場合（主語に合わせて be→is/am/are にする、動詞にsやedを付けるなど）は自然に活用してよい。ただし「turn A into B」のように A・B が記号になっている場合は、A・Bをそのまま使わず、実際の具体的な内容に置きかえて自然な文にすること
- 【重要】対象の単語の品詞は絶対に変えないこと。名詞（例: belief）を動詞（believe）に、動詞を名詞に変えるなど、別の品詞の単語に置きかえてはいけない。活用形を変えるのはOKだが、品詞そのものを変えるのはNG
- 【重要】sentence は主語・動詞がそろった、文法的に完全な一文にすること。単語が途中で抜け落ちて意味が通じない文（例: "I ___ any whispers."のように動詞が抜けている）を作らないこと
- 【重要】主語と動詞の数の一致（三人称単数のs、be動詞の活用など）を必ず正しくすること
- opener（話しかけの一文）の中には、対象の単語・熟語「${target.en}」そのものを書かないこと。sentence（返事）の中だけで使うこと（opener で答えを言ってしまわないこと）
- 【最重要】sentence の中で、指定の単語・熟語を実際に使った部分（活用後の形も含む）を **（アスタリスク2つ）で囲むこと。例: sentenceが "It was unlikely to rain." なら "It **was unlikely to** rain." のように書く。囲む部分は sentence の中に実際に書いてある文字とまったく同じにすること（別の場所に書き換えたり、報告用に新しく書き直したりしないこと）
- sentence の中で、その単語・熟語を2回連続で繰り返さないこと（例:「a virus virus that」のような誤りをしないこと）

【重要】sentence は opener の質問・話題に対する、具体的で筋の通った答えになっていなければいけません。単語を無理やり押し込んだだけの、話がかみ合わない文にしないこと。
- 悪い例（NG）: opener「Do you like drawing?」→ sentence「I recently started playing tennis.」（絵の話をしているのにテニスの話にすり替わっている＝NG）
- 良い例（OK）: opener「Do you like drawing?」→ sentence「Yes, I recently started drawing every day.」（同じ話題のまま、指定の単語を使って具体的に答えている＝OK）

- 最後にキャラが返す短いリアクション（reaction）を1文作る。ここにキャラクターの性格を反映させること
- 日本語訳（openerJa, sentenceJa, reactionJa）は必ず完全な自然な日本語だけで書き、英単語や英熟語をそのまま日本語文の中に混ぜないこと。直訳のせいで意味が通じない日本語（例:「スナックは離れている」のような、主語と動詞の関係がおかしい文）にしないこと。誰が読んでも自然に意味が通る日本語にすること
- 日本語訳の文末表現にも、そのキャラクターの性格・口調を反映させること
- 前に使った例文「${target.sentence}」とは違う場面・文脈にすること
出力は次のJSON形式だけを返し、説明文やコードブロック記号（\`\`\`）は絶対に付けないでください：
{"opener":"英文","openerJa":"その日本語訳","sentence":"英文（対象の部分を**で囲む）","sentenceJa":"その日本語訳","reaction":"英文","reactionJa":"その日本語訳"}`;

  try{
    const data = await callClaudeProxy(prompt);
    const text = (data.content || []).map(b=>b.text||'').join('').trim();
    const parsed = extractJSON(text);
    if(!parsed || !parsed.sentence || !parsed.sentenceJa){
      console.error('generateAIExercise: failed to use AI response for word', target.en, '| raw text:', text, '| parsed:', parsed);
      return null;
    }
    // extract the **marked** phrase directly from the sentence, same as
    // applyGeneratedContent does — keeps this bonus-exercise path in sync
    // with the main generation path
    let rawSentence = parsed.sentence || '';
    let usedPhrase = target.en;
    const markMatch = rawSentence.match(/\*\*(.+?)\*\*/);
    if(markMatch){
      usedPhrase = markMatch[1].trim();
      rawSentence = rawSentence.replace(/\*\*(.+?)\*\*/, '$1');
    }
    const baseWordCount = target.en.trim().split(/\s+/).length;
    if(usedPhrase.trim().split(/\s+/).length > baseWordCount + 1) usedPhrase = target.en;

    return {
      en: target.en, ja: target.ja, cat: target.cat,
      opener: parsed.opener || '', openerJa: parsed.openerJa || '',
      sentence: dedupeAdjacentRepeat(rawSentence, usedPhrase), sentenceJa: parsed.sentenceJa,
      usedPhrase,
      reaction: parsed.reaction || '', reactionJa: parsed.reactionJa || ''
    };
  } catch(e){
    console.error('generateAIExercise: threw for word', target.en, e);
    return null;
  }
}


async function loadQuestion(){
  quizCard.classList.remove('flash-good','flash-bad');
  nextBtn.classList.remove('show');
  nextBtn.textContent = 'つぎへ →';

  if(maybeShowGrammarQuestion()) return; // 10問に1回、文法チェックを割り込ませる

  if(quizIndex >= activeQueue.length){
    npcSub.textContent = 'ありがとう！';
    quizBody.innerHTML = `<div class="npc-done-panel">
      <div class="emoji">🎉</div>
      <p>今日はよくがんばったね！</p>
    </div>`;
    nextBtn.textContent = 'とじる';
    nextBtn.classList.add('show');
    nextBtn.onclick = closeQuiz;
    return;
  }

  const item = activeQueue[quizIndex];
  const myRequestId = ++loadQuestionRequestId;
  await ensureExerciseContent(item);
  if(myRequestId !== loadQuestionRequestId) return; // a newer question started while we were waiting

  // some vocab entries are pattern templates using placeholder letters,
  // e.g. "turn A into B" or "prevent A from B" — in any natural sentence
  // demonstrating them, A and B get replaced with real words, so the
  // literal phrase never appears verbatim and blank-fill mode can't work
  // for these at all (it was leaving a dangling, disconnected blank).
  // Route them to the order exercise only, which just scrambles the
  // whole sentence's tokens and doesn't need to find the phrase as a
  // substring.
  const isTemplateWord = /\bA\b|\bB\b|\bme\b|\byou\b|\bhim\b|\bher\b/i.test(item.en);
  const tokenCount = (item.sentence || '').split(' ').length;
  const preferOrder = isTemplateWord || (quizIndex % 2 !== 0 && tokenCount <= 6);
  const mode = preferOrder ? 'order' : 'blank';
  mode === 'blank' ? renderBlankExercise(item) : renderOrderExercise(item);

  nextBtn.onclick = ()=>{ quizIndex++; loadQuestion(); };
}

function prefetchUpcoming(){
  // only prefetch a single item, one ahead — called right after a correct
  // answer (once conversationContext reflects that exchange), so the
  // very next question's opener has a chance to actually follow on from
  // it. Prefetching further ahead than this defeats continuity, since
  // later items would generate before their own predecessor's reaction
  // is known.
  const next = activeQueue[quizIndex+1];
  if(next) generateAndCache(next); // fire and forget
}

/* ---------- generate example sentences on demand for imported words ---------- */
const pendingGenerations = new Map(); // en -> in-flight Promise, avoids duplicate concurrent requests

function applyGeneratedContent(item, data){
  // extract the **marked** phrase directly from the sentence text itself,
  // rather than trusting a separately-reported usedPhrase field — this
  // guarantees the highlighted phrase can never drift out of sync with
  // what's actually written in the sentence (the root cause of repeated
  // tense/inflection mismatch bugs)
  let rawSentence = data.sentence || '';
  let usedPhrase = item.en;
  const markMatch = rawSentence.match(/\*\*(.+?)\*\*/);
  if(markMatch){
    usedPhrase = markMatch[1].trim();
    rawSentence = rawSentence.replace(/\*\*(.+?)\*\*/, '$1');
  }

  // safety net: if the marked phrase is wildly longer than the target
  // word/phrase (the AI marked a whole clause instead of just the word),
  // discard it and fall back to the plain base form instead
  const baseWordCount = item.en.trim().split(/\s+/).length;
  const usedWordCount = usedPhrase.trim().split(/\s+/).length;
  if(usedWordCount > baseWordCount + 1) usedPhrase = item.en;

  item.sentence = dedupeAdjacentRepeat(rawSentence, usedPhrase);
  item.sentenceJa = data.sentenceJa;
  item.opener = data.opener || '';
  item.openerJa = data.openerJa || '';
  item.reaction = data.reaction || '';
  item.reactionJa = data.reactionJa || '';
  item.usedPhrase = usedPhrase;
}

// occasionally the AI accidentally repeats the target phrase right next
// to itself (e.g. "a virus virus that makes us sick") — likely because
// it's asked to both use the phrase AND report it back as usedPhrase.
// Collapse any such immediate duplication defensively.
function dedupeAdjacentRepeat(sentence, phrase){
  if(!sentence || !phrase) return sentence;
  const re = new RegExp('\\b(' + escapeRegex(phrase) + ')\\s+\\1\\b', 'gi');
  return sentence.replace(re, '$1');
}

function fallbackContent(item){
  return {
    sentence: `I want to learn the word "${item.en}".`,
    sentenceJa: `わたしは「${item.ja}」ということばを覚えたいです。`,
    opener: '', openerJa: '', reaction: '', reactionJa: '',
    usedPhrase: item.en,
  };
}

// generates (or reuses an in-flight) result for one word, with no UI
// side effects — safe to call for background prefetching. No persistent
// cross-session cache anymore: each fresh encounter of a word gets a
// newly-generated sentence for better variety.
async function generateAndCache(item){
  if(item.sentence) return; // already generated earlier this session
  if(pendingGenerations.has(item.en)){
    await pendingGenerations.get(item.en);
    return;
  }
  const p = (async ()=>{
    const generated = await generateSentenceForWord(item);
    const data = generated || fallbackContent(item);
    applyGeneratedContent(item, data);
  })();
  pendingGenerations.set(item.en, p);
  try{ await p; }
  finally{ pendingGenerations.delete(item.en); }
}

const THINKING_MESSAGES = ['ことばを考え中', 'もうすこしまってね', 'ちょっと待ってね'];

async function ensureExerciseContent(item){
  if(item.sentence) return; // curated word, or already generated/prefetched earlier this session

  const msg = THINKING_MESSAGES[Math.floor(Math.random()*THINKING_MESSAGES.length)];
  quizBody.innerHTML = `<div class="npc-done-panel">

    <p>${msg}<span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span></p>
  </div>`;
  nextBtn.classList.remove('show');

  await generateAndCache(item);
}

async function generateSentenceForWord(item){
  const personality = activeNPC ? (activeNPC.def.personality || 'げんき') : 'げんき';
  const contextSection = conversationContext
    ? `\n直前に、このキャラクターとはこんな会話をしていました:\n${conversationContext}\nこれは同じキャラクターとの1つの会話の続きです。まったく新しい話題を始めるのではなく、上の内容を受けて自然に続く opener（話しかけの一文）にしてください。`
    : '';
  const prompt = `あなたは日本の小学校高学年の女の子向け英語学習ゲームに出てくるキャラクター（性格: ${personality}）です。
英検準2級レベルの単語・熟語「${item.en}」（日本語の意味: ${item.ja}）を自然に使った、短い会話を1つ作ってください。${contextSection}

【最優先ルール・絶対に守ること】opener が過去形（did, was, wereなどを使った質問、または"last year"や"yesterday"のような過去を表す語を含む文）の場合、sentence の動詞も必ず過去形にすること。sentence の中に "last year"（去年）や "yesterday"（昨日）のような過去を示す語があるのに、動詞だけ現在形のまま、というのは絶対にNGです。
- 悪い例1（NG）: opener「Did you ever wear costumes for school events?」→ sentence「I dress up as a princess last year.」（"last year"があるのに"dress up"が現在形のまま＝NG）
- 良い例1（OK）: 同じopenerなら → sentence「I dressed up as a princess last year.」（過去形"dressed up"＝OK）
- 悪い例2（NG）: opener「Did you learn anything surprising in French class?」→ sentence「I find out that French nouns have genders.」（過去形の質問なのに"find out"が現在形のまま＝NG）
- 良い例2（OK）: 同じopenerなら → sentence「I found out that French nouns have genders.」（過去形"found out"＝OK）
sentence を書き終えたら、必ずこのルールに違反していないか自分で確認してから出力すること。

【最優先ルール・絶対に守ること】「do me a favor」「tell me about it」のように me/you などの代名詞を含む熟語は、話の流れに合わせて自然な代名詞（you, him, her など）に必ず置きかえること。「宿題を手伝って」と頼まれて手伝う側になった場合、"do me a favor"（自分のために）ではなく "do you a favor"（相手のために）が正しいことに注意すること。
- 悪い例（NG）: opener「Can you help with my homework?」→ sentence「Sure, I can do me a favor now.」（手伝う側なのに"me"のまま＝お願いする側とされる側が逆でおかしい＝NG）
- 良い例（OK）: 同じopenerなら → sentence「Sure, I can do you a favor now.」（手伝う相手を正しく"you"にしている＝OK）
sentence を書き終えたら、必ずこのルールに違反していないか自分で確認してから出力すること。

会話の作り方（この順番で考えること）：
1. まず、そのキャラクターらしい話しかけの一文（opener）を考える。opener の中には、対象の単語・熟語「${item.en}」そのものを書かないこと（opener で答えを言ってしまわないこと）
2. その話しかけに対する返事として、指定の単語・熟語を使った一文（sentence）を作る

【重要】sentence は opener の質問・話題に対する、具体的で筋の通った答えになっていなければいけません。単語を無理やり押し込んだだけの、話がかみ合わない文にしないこと。
- 悪い例（NG）: opener「Do you like drawing?」→ sentence「I recently started playing tennis.」（絵の話をしているのにテニスの話にすり替わっている＝NG）
- 良い例（OK）: opener「Do you like drawing?」→ sentence「Yes, I recently started drawing every day.」（同じ話題のまま、指定の単語を使って具体的に答えている＝OK）
このように、opener で聞かれたことに sentence がまっすぐ答える形にしてください。

3. 最後に、その返事を受けてキャラクターが返す短いリアクション（reaction）を1文作る
4. 【最重要】sentence の中で、指定の単語・熟語を実際に使った部分（活用後の形も含む）を **（アスタリスク2つ）で囲むこと。例: sentenceが "It was unlikely to rain." なら "It **was unlikely to** rain." のように書く。囲む部分は sentence の中に実際に書いてある文字とまったく同じにすること
5. sentence の中で、その単語・熟語を2回連続で繰り返さないこと（例:「a virus virus that」のような誤りをしないこと）

条件：
- 中学生にもわかる、やさしい英文にすること
- opener・sentence・reaction は、それぞれ8語以内のごく短い一文にすること（長い文にしないこと。特にsentenceは短いほど良い）
- 文法上必要な場合（主語に合わせて be→is/am/are にする、動詞にsやedを付けるなど）は自然に活用してよい。ただし「turn A into B」のように A・B が記号になっている場合は、A・Bをそのまま使わず、実際の具体的な内容に置きかえて自然な文にすること
- 【重要】対象の単語の品詞は絶対に変えないこと。名詞を動詞に、動詞を名詞に変えるなど、別の品詞の単語に置きかえてはいけない
- 【重要】sentence は主語・動詞がそろった、文法的に完全な一文にすること。単語が途中で抜け落ちて意味が通じない文を作らないこと
- 【重要】主語と動詞の数の一致（三人称単数のs、be動詞の活用など）を必ず正しくすること
- 日本語訳（openerJa, sentenceJa, reactionJa）は必ず完全な自然な日本語だけで書き、英単語や英熟語をそのまま日本語文の中に混ぜないこと。直訳のせいで意味が通じない日本語（例:「スナックは離れている」のような、主語と動詞の関係がおかしい文）にしないこと。誰が読んでも自然に意味が通る日本語にすること
出力は次のJSON形式だけを返し、説明文やコードブロック記号（\`\`\`）は絶対に付けないでください：
{"opener":"英文","openerJa":"その日本語訳","sentence":"英文（対象の部分を**で囲む）","sentenceJa":"その日本語訳","reaction":"英文","reactionJa":"その日本語訳"}`;

  try{
    const data = await callClaudeProxy(prompt);
    const text = (data.content || []).map(b=>b.text||'').join('').trim();
    const parsed = extractJSON(text);
    if(!parsed || !parsed.sentence || !parsed.sentenceJa){
      console.error('generateSentenceForWord: failed to use AI response for word', item.en, '| raw text:', text, '| parsed:', parsed);
      return null;
    }
    return parsed;
  } catch(e){
    console.error('generateSentenceForWord: threw for word', item.en, e);
    return null;
  }
}

/* ---------- exercise 1: fill the blank in the NPC's sentence ---------- */
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function insertBlank(sentence, target){
  const re = new RegExp(escapeRegex(target), 'i'); // case-insensitive, matches AI-generated text too
  if(re.test(sentence)){
    return sentence.replace(re, '<span class="blank-slot" id="blankSlot">___</span>');
  }
  // fallback: target word form wasn't found verbatim (e.g. AI inflected it) —
  // still show a usable blank rather than breaking the exercise
  return sentence + ' <span class="blank-slot" id="blankSlot">___</span>';
}

function renderBlankExercise(item){
  quizBody.innerHTML = `
    <div class="dialogue-bubble"><span class="en">${item.opener || ''}</span><span class="ja">${item.openerJa || ''}</span></div>

function handleBlankAnswer(input, typedValue, item){

/* ---------- exercise 2: build the English sentence (word order / 英作文) ---------- */
function renderOrderExercise(item){
  const tokens = item.sentence.split(' ');
  const pool = shuffle(tokens);

  quizBody.innerHTML = `
    <div class="dialogue-bubble"><span class="en">${item.opener || ''}</span><span class="ja">${item.openerJa || ''}</span></div>
    <span class="reply-label">きみの返事 ▼</span>
    <div class="ja-hint">${item.sentenceJa}</div>
    <div class="build-line" id="buildLine"></div>
    <div class="order-controls">
      <button class="undo-btn" id="undoBtn">↩️ ひとつ戻す</button>
      <button class="speak-btn" id="speakBtn" aria-label="お手本を聞く">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="chip-pool" id="chipPool"></div>
    <div id="feedbackSlot"></div>
    <div id="reactionSlot"></div>
  `;
  document.getElementById('speakBtn').onclick = ()=> speakEnglish(item.sentence);
  document.getElementById('undoBtn').onclick = ()=>{
    if(nextBtn.classList.contains('show')) return; // locked after check
    if(built.length === 0) return;
    built.pop();
    renderChips();
    renderBuild();
  };

  const buildLine = document.getElementById('buildLine');
  const chipPool = document.getElementById('chipPool');
  let built = [];

  function renderChips(){
    chipPool.innerHTML = '';
    pool.forEach((word, idx)=>{
      if(built.includes(idx)) return;
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = word;
      chip.onclick = ()=>{
        built.push(idx);
        renderChips();
        renderBuild();
        if(built.length === tokens.length) checkOrder();
      };
      chipPool.appendChild(chip);
    });
  }

  function renderBuild(){
    buildLine.innerHTML = '';
    built.forEach((idx)=>{
      const chip = document.createElement('button');
      chip.className = 'build-chip';
      chip.textContent = pool[idx];
      chip.onclick = ()=>{
        if(nextBtn.classList.contains('show')) return; // locked after check
        built = built.filter(i=>i!==idx);
        renderChips();
        renderBuild();
      };
      buildLine.appendChild(chip);
    });
  }

  function checkOrder(){
    totalAnswered++;
    const answer = built.map(idx=>pool[idx]).join(' ');
    const correct = answer === item.sentence;
    const buildChips = buildLine.querySelectorAll('.build-chip');
    buildChips.forEach(c=> c.classList.add('locked'));

    if(correct){
      buildChips.forEach(c=> c.classList.add('correct'));
      quizCard.classList.add('flash-good');
      markMastered(item);
      recordDailyProgress();
      burstSparkles(buildLine);
      playCorrectSound();
      document.getElementById('feedbackSlot').innerHTML =
        `<div class="feedback-banner correct">✅ Correct! <span class="ja">せいかい！</span></div>`;
      if(item.reaction){
        document.getElementById('reactionSlot').innerHTML =
          `<div class="reaction-bubble"><span class="en">${item.reaction}</span><span class="ja">${item.reactionJa||''}</span></div>`;
      }
      recordMistakeResolved(item.en);
      conversationContext = formatExchange(item);
      prefetchUpcoming();
      speakEnglish([item.opener, item.sentence, item.reaction].filter(Boolean).join(' '));
    } else {
      buildChips.forEach(c=> c.classList.add('wrong'));
      quizCard.classList.add('flash-bad');
      playWrongSound();
      document.getElementById('feedbackSlot').innerHTML =
        `<div class="feedback-banner wrong">❌ Not quite! <span class="ja">おしい！</span></div>`;
      const ans = document.createElement('div');
      ans.className = 'sentence-answer';
      ans.textContent = 'せいかい: ' + item.sentence;
      quizBody.appendChild(ans);
      recordMistake(item.en);
      speakEnglish(item.sentence);
    }
    nextBtn.classList.add('show');
  }

  renderChips();
}

function markMastered(item){
  if(!masteredWords.has(item.en)){
    masteredWords.add(item.en);
    addOrb(); // awards +3 coins for a brand-new word
    refreshAllNpcCounts();
  } else {
    addCoins(1); // smaller reward for correctly reviewing an already-known word
  }
  saveProgress();
}

/* ---------- voice selection: use Samantha (US English) on Safari/iOS ---------- */
let preferredVoice = null;
function pickPreferredVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if(!voices.length) return null;
  return voices.find(v => v.name === 'Samantha')
      || voices.find(v => v.name.includes('Samantha'))
      || voices.find(v => v.lang === 'en-US')
      || voices[0];
}
if('speechSynthesis' in window){
  preferredVoice = pickPreferredVoice();
  window.speechSynthesis.onvoiceschanged = ()=>{ preferredVoice = pickPreferredVoice(); };
}

function speakEnglish(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.85;
  if(!preferredVoice) preferredVoice = pickPreferredVoice();
  if(preferredVoice) u.voice = preferredVoice;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

  const justUnlocked = ISLANDS.find(i => i.unlockAt === masteredWords.size && i.status !== 'comingSoon');
  if(justUnlocked){
    setTimeout(()=> showToast(`🏝️ あたらしい島「${justUnlocked.name}」に行けるようになったよ！`), 1800);
  }
}

function showToast(text){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:95; background:rgba(74,59,92,0.92); color:#fff; font-weight:800; font-size:13px; padding:12px 20px; border-radius:16px; max-width:80vw; text-align:center; box-shadow:0 10px 28px rgba(0,0,0,0.3);';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 5000);
}

function burstSparkles(btn){
  const rect = btn.getBoundingClientRect();
  const emojis=['✨','⭐','💫'];
  for(let i=0;i<6;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=(rect.left+rect.width/2)+'px';
    s.style.top=(rect.top+rect.height/2)+'px';
    const dx=(Math.random()-0.5)*160, dy=-Math.random()*140-20;
    s.style.setProperty('--dx',dx+'px'); s.style.setProperty('--dy',dy+'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),950);
  }
}

// show the save-code screen (if needed), then restore mastered words,
// mistake history, coins, and the cat collection for that code
ensurePlayerCode().then(()=>{
  loadProgress().then(refreshAllNpcCounts);
});
applyDayNight();
updateIslandUI();
updateWordPercent();
npcs.forEach(n=>{ n.mesh.visible = (n.def.world === currentIslandId); });
mazeGateLandmark.group.visible = (currentIslandId === 'themepark');
themeparkDecorGroup.visible = (currentIslandId === 'themepark');
landmarks.forEach(l=>{
  if(CITY_ONLY_LANDMARK_IDS.has(l.id)) l.group.visible = (currentIslandId === 'city');
  if(THEMEPARK_ONLY_LANDMARK_IDS.has(l.id)) l.group.visible = (currentIslandId === 'themepark');
});
